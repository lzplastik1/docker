plugins {
    id 'com.android.application'
}

// 网页版 APP（../index.html 等）在打包时复制进安装包的 assets/www/
def webOut = layout.buildDirectory.dir('generated/web').get().asFile
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', '*.png', 'manifest.webmanifest'
    }
    into new File(webOut, 'www')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn copyWeb }

android {
    namespace 'com.lzplastik.tripwallet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lzplastik.tripwallet'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0.${System.getenv('VERSION_CODE') ?: '1'}"
    }

    // 固定签名：每次更新都能直接覆盖安装，数据不丢
    signingConfigs {
        release {
            storeFile file('tripwallet.keystore')
            storePassword 'tripwallet'
            keyAlias 'tripwallet'
            keyPassword 'tripwallet'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main { assets.srcDirs += [webOut] }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
