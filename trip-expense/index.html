/* Layout: one phone-width column; sticky trip header, glass tab bar, bottom sheets. Deep emerald gradients with champagne-gold highlights. */
:root{
  --bg:#EDF1EF; --bg2:#E3EBE7; --surface:#FFFFFF; --surface2:#F3F6F5; --ink:#0F1F1A; --muted:#5B6B65; --line:#DCE4E0;
  --accent:#0E6B57; --accent-2:#17977B; --accent-soft:#DDEFE8; --on-accent:#FFFFFF;
  --gold:#B98A3A; --gold-soft:#F6EBD6;
  --g1:#052A24; --g2:#0C5747; --g3:#169078; --glow:rgba(226,190,120,.42); --on-hero:#F3FBF8; --hero-mute:rgba(243,251,248,.72);
  --glass:rgba(255,255,255,.80); --glass-line:rgba(15,31,26,.08);
  --pos:#18794A; --neg:#B5363A; --warn:#9A5716; --warn-soft:#F7EAD8;
  --scrim:rgba(6,20,16,.5);
  --shadow:0 1px 1px rgba(10,40,30,.04),0 2px 6px rgba(10,40,30,.05),0 12px 28px -12px rgba(10,40,30,.14);
  --shadow-hero:0 22px 44px -22px rgba(5,42,36,.75),0 8px 18px -10px rgba(5,42,36,.4);
  --f-display:"BarlowApp","Barlow",-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08100D; --bg2:#0C1713; --surface:#111B17; --surface2:#17231E; --ink:#E5EEEA; --muted:#8EA199; --line:#22312B;
  --accent:#46C3A0; --accent-2:#2BA586; --accent-soft:#163A2F; --on-accent:#04140F;
  --gold:#DDB672; --gold-soft:#3A2F1C;
  --g1:#03201A; --g2:#0A4639; --g3:#147D67; --glow:rgba(221,182,114,.30); --on-hero:#F3FBF8; --hero-mute:rgba(243,251,248,.7);
  --glass:rgba(17,27,23,.82); --glass-line:rgba(255,255,255,.06);
  --pos:#55C98A; --neg:#F27A7A; --warn:#E8A35E; --warn-soft:#3A2A19;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);

:root[data-theme="dark"]{

  --accent:#46C3A0; --accent-2:#2BA586; --accent-soft:#163A2F; --on-accent:#04140F;
  --gold:#DDB672; --gold-soft:#3A2F1C;
  --g1:#03201A; --g2:#0A4639; --g3:#147D67; --glow:rgba(221,182,114,.30); --on-hero:#F3FBF8; --hero-mute:rgba(243,251,248,.7);
  --glass:rgba(17,27,23,.82); --glass-line:rgba(255,255,255,.06);
  --pos:#55C98A; --neg:#F27A7A; --warn:#E8A35E; --warn-soft:#3A2A19;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);
  --shadow-hero:0 22px 44px -22px rgba(0,0,0,.85); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,var(--bg2),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--glass-line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.trip-btn{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.trip-btn b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-btn span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.grey{background:var(--surface2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
main.wrap{padding-block:14px 150px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--glass-line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:8px 2px -4px}
.sec-t h3{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:4px}

/* 钱袋主卡：渐变 + 金色光晕 + 细纹 */
.hero{position:relative;overflow:hidden;isolation:isolate;color:var(--on-hero);border-radius:26px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(110% 80% at 105% -10%,var(--glow),transparent 55%),radial-gradient(80% 70% at -10% 120%,rgba(23,151,123,.55),transparent 60%),linear-gradient(145deg,var(--g1) 0%,var(--g2) 52%,var(--g3) 100%);
  box-shadow:var(--shadow-hero)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.12;background:repeating-linear-gradient(115deg,rgba(255,255,255,.5) 0 1px,transparent 1px 14px);-webkit-mask-image:linear-gradient(200deg,#000,transparent 65%);mask-image:linear-gradient(200deg,#000,transparent 65%)}
.hero .lbl{font-size:12px;color:var(--hero-mute);letter-spacing:.08em}
.hero .big{font-size:38px;font-weight:700;line-height:1.08;letter-spacing:-.03em;background:linear-gradient(92deg,#FFFFFF 30%,#F1DDB0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .row{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--hero-mute)}
.hero .row b{font-family:var(--f-display);font-weight:600;color:var(--on-hero)}
.hero .acts{display:flex;gap:10px}
.hero .acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:14px;font-weight:700;font-size:15px;color:var(--on-hero);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero .acts button i{font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#F3DFB2,#C9994A);color:#3B2A0C;font-size:13px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#F3DFB2,#D3A453);border-radius:9px}
.bar.over i{background:linear-gradient(90deg,#FFB4A8,#F06A5A)}
.src{display:flex;flex-wrap:wrap;gap:6px}
.src span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.src span b{font-weight:600}

.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acct{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--surface) 40%,var(--surface2));border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;width:100%}
.acct::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent-2),var(--gold))}
.acct .c{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.acct .v{font-size:19px;font-weight:600;overflow-wrap:anywhere}
.acct .r{font-size:11px;color:var(--muted)}
.acct.neg-b{border-color:var(--neg)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{background:var(--surface);border:1px solid var(--glass-line);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;text-align:left}
.quick button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.quick .ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--accent-2),var(--g2))}
.quick .ic.gold{background:linear-gradient(135deg,#E6C27F,#A9782E)}
.rows{display:flex;flex-direction:column}
.txr{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.rows .txr:last-child{border-bottom:0}
.ic-sq{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;background-image:linear-gradient(140deg,rgba(255,255,255,.28),rgba(0,0,0,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.txr .mid{flex:1;min-width:0}
.txr .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.txr .t1 span.n{overflow:hidden;text-overflow:ellipsis}
.txr .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txr .rt{text-align:right;flex:none;max-width:48%}
.txr .a1{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.txr .a2{font-size:11px;color:var(--muted)}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;padding:14px 2px 4px;letter-spacing:.03em}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;background-image:linear-gradient(140deg,rgba(255,255,255,.3),rgba(0,0,0,.2))}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.rows .mrow:last-child{border-bottom:0}
.mrow .nm{flex:1;min-width:0;font-weight:600}
.mrow .sub{font-size:12px;color:var(--muted);font-weight:400}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px);border-top:1px solid var(--glass-line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent-2),var(--gold))}
.fab{position:fixed;z-index:7;right:max(18px,calc(50% - 262px),env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border-radius:28px;border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;
  background:radial-gradient(90% 120% at 100% 0%,rgba(241,221,176,.45),transparent 60%),linear-gradient(135deg,var(--g3),var(--g1));box-shadow:0 14px 30px -10px rgba(5,42,36,.6)}
.fab b{font-size:24px;line-height:1;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip .av{width:22px;height:22px;font-size:11px}
.chip.off .av{filter:grayscale(1);opacity:.5}
.seg{display:flex;background:var(--surface2);border:1px solid var(--glass-line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 4px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;font-weight:700;box-shadow:0 6px 14px -8px rgba(14,107,87,.8)}
.filters{display:flex;flex-direction:column;gap:10px}
.filters .seg{overflow-x:auto;scrollbar-width:none}
.filters .seg button{flex:1 0 auto;padding-inline:10px}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow>*{flex:1;min-width:120px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
label.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
.ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.in{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow-y:auto;border-radius:24px 24px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(24px);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;box-shadow:0 -20px 40px -20px rgba(0,0,0,.35)}
.sheet.wide{max-width:900px}
.ov.in .sheet{transform:none}
@media (prefers-reduced-motion:reduce){.ov,.sheet{transition:none}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.sh-head::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
.sh-head h2{flex:1;margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em;text-wrap:balance}
.x{border:0;background:var(--surface2);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.amt{display:flex;gap:8px;align-items:stretch}
.amt select{flex:none;width:auto;font-weight:600}
.amt input{flex:1;font-family:var(--f-display);font-size:26px;font-weight:600;padding:8px 12px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.prev{background:var(--surface);border:1px solid var(--glass-line);border-radius:16px;padding:4px 14px}
.prev .pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prev .pr:last-child{border-bottom:0}
.prev .pr .nm{flex:1}
.prev .pr input{width:110px;text-align:right}
.err{color:var(--neg);font-size:13px;font-weight:600}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:700;font-size:16px;color:#fff;width:100%;background:radial-gradient(90% 140% at 100% 0%,rgba(241,221,176,.35),transparent 60%),linear-gradient(135deg,var(--g3),var(--g2));box-shadow:0 12px 24px -14px rgba(5,42,36,.8)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn2{border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ink)}
.btn2.danger{color:var(--neg)}
.btn2.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2);border:0;padding:0;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.ph.add{display:grid;place-items:center;border:1.5px dashed var(--line);background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;text-align:center}
.ph.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv>div:last-child{border-bottom:0}
.kv>div>span:first-child{color:var(--muted);flex:none}
.kv>div>span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.d-amt{text-align:center;padding:8px 0 2px}
.d-amt .v{font-size:34px;font-weight:700}
.statbar{display:flex;flex-direction:column;gap:10px}
.sb{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;font-size:13px}
.sb .tr{height:10px;background:var(--surface2);border-radius:9px;overflow:hidden}
.sb .tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.sb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:12px}
.scroll-x{overflow-x:auto}
.xfer{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.xfer:last-child{border-bottom:0}
.xfer .ar{color:var(--muted)}
.xfer .v{margin-left:auto;font-weight:700}
.viewer{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.viewer .vt{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.viewer .vt button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-weight:600}
.viewer .vs{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.viewer .vs img{max-width:100%;max-height:100%;object-fit:contain}
.viewer.zoom .vs{display:block}
.viewer.zoom .vs img{max-width:none;max-height:none;width:200%}
.viewer .nav{display:flex;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer .nav button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.viewer .nav button:disabled{opacity:.3}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:88vw;text-align:center}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:10px 14px;font-size:13px}
.banner b{flex:1}
.banner button{border:0;background:var(--warn);color:var(--surface);border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px;flex:none}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;height:140px}
.set-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row input.in{padding:8px 10px}
.set-row .grow{flex:1;min-width:0}
.mini{border:0;background:var(--surface2);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);flex:none}
h4{margin:0 0 8px;font-size:15px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);font-weight:600;flex:none}
.tag.adv{background:var(--warn-soft);color:var(--warn)}
.tag.ph{background:var(--accent-soft);color:var(--accent)}
.tag.ext{background:var(--gold-soft);color:var(--gold)}
.sw{display:flex;align-items:center;gap:10px;font-size:14px}
.sw input{width:20px;height:20px;accent-color:var(--accent)}

/* A4 账单（竖版）：纸张固定白底，字号用 pt/mm，屏幕预览与打印一致 */
.paper-wrap{overflow-x:auto;border-radius:14px;background:#9AA5A1;padding:10px 0;box-shadow:var(--shadow)}
.a4{background:#fff;color:#14201C;font-family:Roboto,"Noto Sans",var(--f-body);font-size:8.6pt;line-height:1.35;width:210mm;padding:12mm;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper-wrap .a4+.a4{margin-top:6mm}
.a4 .n{font-family:var(--f-display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.a4 .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;padding-bottom:2.5mm;border-bottom:.6mm solid #0E6B57}
.a4 h1{margin:0;font-family:var(--f-display);font-size:15pt;line-height:1.1;color:#0B3F34}
.a4 .sub{font-size:9pt;color:#64716C;margin-top:1mm}
.a4 .meta{font-size:7.4pt;color:#64716C;text-align:right;line-height:1.5;white-space:nowrap}
.a4 .kpi{display:grid;grid-template-columns:repeat(4,1fr);border:.25mm solid #DDE5E1;border-radius:2mm;margin:3mm 0 3.5mm}
.a4 .kpi div{padding:1.8mm 3mm;border-left:.25mm solid #DDE5E1}
.a4 .kpi div:first-child{border-left:0}
.a4 .kpi span{display:block;font-size:6.8pt;color:#64716C;letter-spacing:.03em}
.a4 .kpi b{font-family:var(--f-display);font-size:11pt;font-variant-numeric:tabular-nums}
.a4 .in{color:#16703F}.a4 .out{color:#A3312F}
.a4 table{width:100%;border-collapse:collapse;table-layout:fixed}
.a4 th{font-size:7pt;font-weight:600;color:#44524D;text-align:left;padding:1.4mm 1.2mm;background:#F3F6F5;border-bottom:.3mm solid #B9C7C1}
.a4 th.n{text-align:right;white-space:normal}
.a4 td{padding:1.5mm 1.2mm;border-bottom:.2mm solid #DDE5E1;vertical-align:top;overflow-wrap:anywhere}
.a4 tr{break-inside:avoid}
.a4 thead{display:table-header-group}
.a4 td.i{color:#64716C;font-size:7.4pt}
.a4 td.w b{display:block;font-weight:600}
.a4 td.w span{color:#64716C;font-size:7.4pt}
.a4 td.who{font-size:7.8pt;color:#33403B}
.a4 td.none{text-align:center;color:#8A9692;padding:4mm}
.a4 .tag{display:inline-block;font-size:6.6pt;font-weight:700;letter-spacing:.02em;padding:.2mm 1.4mm;border-radius:1mm;margin-right:1.2mm;vertical-align:.2mm}
.a4 .t-in{background:#E3F2E9;color:#16703F}.a4 .t-sh{background:#DDEFE8;color:#0E6B57}.a4 .t-me{background:#F7EAD8;color:#8A5212}.a4 .t-fx{background:#ECEFEE;color:#55625D}
.a4 .m2{color:#64716C}
.a4 .pic{color:#8A6A2A;font-size:7.4pt}
.a4 .o2{display:block;font-size:6.8pt;color:#64716C}
.a4 tr.tot td,.a4 tr.open td{background:#F3F6F5;font-weight:700;border-bottom:0}
.a4 .h2{display:flex;align-items:baseline;justify-content:space-between;margin:5mm 0 1.5mm}
.a4 .h2 h2{margin:0;font-size:10pt;font-family:var(--f-display)}
.a4 .h2 span{font-size:7.4pt;color:#64716C}
.a4 .mem{margin-top:4.5mm;break-inside:avoid}
.a4 .keep{break-inside:avoid}
.a4 .mh{display:flex;align-items:center;flex-wrap:wrap;gap:1mm 3mm;padding:1.6mm 2.4mm;border-radius:1.6mm;background:linear-gradient(90deg,#0B3F34,#0E6B57);color:#fff}
.a4 .mh b{font-size:10pt;font-family:var(--f-display);flex:1}
.a4 .mh span{font-size:7.6pt;color:rgba(255,255,255,.82)}
.a4 .mh span i{font-style:normal;font-family:var(--f-display);font-weight:600;color:#fff}
.a4 .mf{text-align:right;font-size:7.4pt;color:#64716C;margin-top:1.6mm}
.a4 .sig{display:flex;gap:10mm;margin-top:9mm;font-size:8pt;color:#3A4642;break-inside:avoid}
.a4 .sig span{flex:1;border-top:.25mm solid #8A9692;padding-top:1mm}
.a4 .fine{font-size:6.8pt;color:#7A8682;margin-top:1.6mm}
.a4 .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:3mm}
.a4 figure{margin:0;border:.25mm solid #DDE5E1;border-radius:2mm;padding:2mm;break-inside:avoid}
.a4 figure img{display:block;width:100%;height:95mm;object-fit:contain;background:#F3F6F5}
.a4 figcaption{font-size:7.4pt;color:#3A4642;margin-top:1.5mm}
#print-root{display:none}
/* 计算器键盘 */
#calc{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -12px 30px -12px rgba(0,0,0,.35);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#calc .in-wrap{max-width:560px;margin:0 auto}
#calc .disp{display:flex;align-items:center;gap:10px;padding:4px 4px 8px}
#calc .expr{flex:1;min-width:0;font-family:var(--f-display);font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#calc .res{font-family:var(--f-display);font-size:22px;font-weight:700;white-space:nowrap}
#calc .done{border:0;border-radius:12px;padding:9px 16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g3),var(--g2))}
#calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#calc .keys button{border:0;border-radius:12px;padding:13px 0;font-size:21px;font-family:var(--f-display);font-weight:600;background:var(--surface2);color:var(--ink);touch-action:manipulation}
#calc .keys button.op{background:var(--accent-soft);color:var(--accent)}
#calc .keys button.eq{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff}
#calc .keys button:active{filter:brightness(.92)}
body.calc-open .sheet{padding-bottom:330px}
body.calc-open main.wrap{padding-bottom:360px}
/* 密码锁 */
#lock{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:var(--on-hero);
  background:radial-gradient(110% 70% at 100% 0%,var(--glow),transparent 55%),linear-gradient(160deg,var(--g1),var(--g2) 60%,var(--g3))}
#lock h2{margin:0;font-family:var(--f-display);font-size:22px}
#lock .dots{display:flex;gap:14px;height:16px}
#lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
#lock .dots i.on{background:#F1DDB0;border-color:#F1DDB0}
#lock .msg{min-height:20px;font-size:14px;color:#FFD2C8}
#lock .pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
#lock .pad button{height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:26px;font-family:var(--f-display)}
#lock .pad button.t{font-size:14px;border:0;background:none}
#lock .lk-link{background:none;border:0;color:rgba(255,255,255,.8);font-size:13px;text-decoration:underline}
#lock.shake .dots{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){#lock.shake .dots{animation:none}}
/* 小票照片附页 */
.fxwarn{color:var(--warn);font-weight:600}
.sugs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 0;font-weight:400}
.sugs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugs button b{color:var(--accent)}
@media print{
  @page{size:A4;margin:12mm}
  :root{padding:0!important}
  html,body{background:#fff!important;height:auto}
  body::before{display:none}
  body>*:not(#print-root){display:none!important}
  #calc,#lock{display:none!important}
  #print-root{display:block!important}
  .a4{width:auto;padding:0;margin:0}
  .a4+.a4{break-before:page}
}

/* ===== 极光白：纯白底，顶部柔和极光，毛玻璃卡片 ===== */
:root{--bg:#FFFFFF;--bg2:#FFFFFF;--surface:#FFFFFF;--surface2:#F4F5F8;--ink:#101318;--muted:#5F6672;--line:#EEF0F4;
  --accent:#101318;--accent-2:#2A2F38;--accent-soft:#F1F3F6;--gold:#6A4FD8;--gold-soft:#EEE9FF;
  --pos:#14895F;--neg:#E0453F;--warn:#A2581A;--warn-soft:#FFF3E8;
  --glass:rgba(255,255,255,.62);--glass-line:rgba(255,255,255,.85);--scrim:rgba(16,19,24,.35);
  --shadow:0 1px 0 #EEF0F4,0 12px 28px -18px rgba(30,40,80,.28);
  --au1:rgba(96,214,180,1);--au2:rgba(170,146,255,1);--au3:rgba(255,172,128,.95)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07080C;--bg2:#07080C;--surface:#111319;--surface2:#181B23;--ink:#F1F3F7;--muted:#8E95A3;--line:#20242E;
  --accent:#F1F3F7;--accent-2:#D7DBE3;--accent-soft:#1A1E27;--gold:#B7A6FF;--gold-soft:#221C3D;
  --pos:#3FC28C;--neg:#FF6B66;--warn:#E8A35E;--warn-soft:#2A2116;
  --glass:rgba(17,19,25,.62);--glass-line:rgba(255,255,255,.08);--scrim:rgba(0,0,0,.6);
  --shadow:0 14px 30px -18px rgba(0,0,0,.85);--au1:rgba(40,160,125,.6);--au2:rgba(120,85,235,.6);--au3:rgba(215,115,70,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07080C;--bg2:#07080C;--surface:#111319;--surface2:#181B23;--ink:#F1F3F7;--muted:#8E95A3;--line:#20242E;
  --accent:#F1F3F7;--accent-2:#D7DBE3;--accent-soft:#1A1E27;--gold:#B7A6FF;--gold-soft:#221C3D;
  --pos:#3FC28C;--neg:#FF6B66;--warn:#E8A35E;--warn-soft:#2A2116;
  --glass:rgba(17,19,25,.62);--glass-line:rgba(255,255,255,.08);--scrim:rgba(0,0,0,.6);
  --shadow:0 14px 30px -18px rgba(0,0,0,.85);--au1:rgba(40,160,125,.6);--au2:rgba(120,85,235,.6);--au3:rgba(215,115,70,.45);color-scheme:dark}
body{background:var(--bg);background-image:none}
.aurora{position:absolute;left:0;right:0;top:0;height:560px;z-index:-1;pointer-events:none;overflow:hidden}
.aurora::before{content:"";position:absolute;inset:-40px;filter:blur(14px);background:
  radial-gradient(48% 52% at 10% 16%,var(--au1),transparent 72%),
  radial-gradient(52% 58% at 90% 6%,var(--au2),transparent 72%),
  radial-gradient(58% 48% at 60% 56%,var(--au3),transparent 74%)}
.aurora::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg) 100%)}
body::before{background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
header.top{background:transparent;border-bottom:0;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background-color .2s}
body.scrolled header.top{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);box-shadow:0 1px 0 var(--line)}
header.top .wrap{padding-block:16px 12px}
.trip-btn b{font-size:24px;font-weight:700;letter-spacing:-.03em}
.trip-btn span{color:var(--muted)}
main.wrap{padding-block:8px 170px;gap:16px}
.sec-t{margin:10px 4px -6px}
.sec-t h3{font-size:12px;letter-spacing:.04em;font-weight:500}
.link{color:var(--ink);font-weight:600}
.card,.acct,.quick button,.prev{border:0;background:var(--surface);box-shadow:var(--shadow)}
.card{border-radius:22px}
.pill{background:var(--glass);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.pill.warn{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.pill.gold{background:var(--ink);color:var(--bg);box-shadow:none}
button{transition:transform .14s ease,background-color .14s ease}
.quick button:active,.btn:active,.btn2:active,.chip:active,.hero .acts button:active,.acct:active,.fab:active,.txr:active,.mrow:active{transform:scale(.975)}
@media (prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none!important}}
/* 毛玻璃主卡 */
.hero{color:var(--ink);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);border-radius:28px;padding:22px;gap:16px;
  box-shadow:0 22px 50px -26px rgba(70,50,140,.38),inset 0 0 0 1px var(--glass-line)}
.hero::after{display:none}
.hero-top{display:none}
.hero .lbl{color:var(--muted);letter-spacing:0;font-size:13px}
.hero .big{font-size:48px;font-weight:700;letter-spacing:-.025em;line-height:1.04;background:none;color:var(--ink);-webkit-text-fill-color:currentColor;margin-top:2px}
.hero .row{color:var(--muted)}
.hero .row b{color:var(--ink);font-weight:600}
.src span{background:var(--surface2);border:0;color:var(--muted)}
.src span b{color:var(--ink)}
.bar{background:rgba(16,19,24,.08);height:5px}
.bar i{background:var(--ink)}
.bar.over i{background:var(--neg)}
.hero .acts{gap:10px}
.hero .acts button{height:50px;border-radius:16px;padding:0 8px;background:var(--surface);border:0;color:var(--ink);font-weight:600;font-size:15px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 1px var(--line),0 6px 14px -10px rgba(30,40,80,.3)}
.hero .acts button:first-child{background:var(--ink);color:var(--bg);box-shadow:0 10px 20px -12px rgba(16,19,24,.6)}
.hero .acts button i{width:auto;height:auto;background:none;color:inherit}
.hero .acts button i svg{width:19px;height:19px}
/* 快捷按钮 */
.quick{gap:12px}

const TKK=Object.keys(TK).filter(k=>k.length>1).sort((a,b)=>b.length-a.length);
const HAN=/[一-鿿]/;
function trText(s){
  if(LANG!=='tk'||s==null||!HAN.test(s))return s;
  const t=String(s).trim();
  if(TK[t]!=null)return String(s).replace(t,TK[t]);
  let r=t;
  for(const [re,rep] of TKP){if(re.test(r)){r=r.replace(re,rep);break}}
  for(const k of TKK)if(r.includes(k))r=r.split(k).join(TK[k]);
  r=r.replace(/(?:钱袋|Gapjyk) ([A-Z]{3}) (.+?) 账户/g,'Gapjyk: $1 ($2) hasaby').replace(/(^|[\s（(·/])共 /g,'$1jemi ').replace(/· 总 /g,'· jemi ').replace(/^占 /,'Paýy ').replace(/ · 按 1/g,' · kurs 1').replace(/ 至 /g,' – ')
     .replace(/(\d+)\s*笔相关/g,'$1 degişli ýazgy').replace(/(\d+)\s*人/g,'$1 adam').replace(/(\d+)\s*笔/g,'$1 ýazgy').replace(/(\d+)\s*份/g,'$1 paý').replace(/(\d+)\s*天/g,'$1 gün').replace(/(\d+)\s*张/g,'$1 surat')
     .replace(/（/g,' (').replace(/）/g,')').replace(/，/g,', ').replace(/。/g,'. ').replace(/：/g,': ').replace(/；/g,'; ').replace(/、/g,', ').replace(/「|“/g,'«').replace(/」|”/g,'»')
     .replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/ {2,}/g,' ').trim();
  return String(s).replace(t,r);
}
const L=s=>trText(s);
function tr(root){
  if(LANG!=='tk'||!root)return;
  if(root===document.body||root.contains?.($('#hdr')))document.title=trText(document.title);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];let n;
  while(n=w.nextNode()){if(HAN.test(n.nodeValue)&&!n.parentElement.closest('script,style,textarea,[translate="no"]'))ns.push(n)}
  ns.forEach(n=>n.nodeValue=trText(n.nodeValue));
  if(root.querySelectorAll)[root,...root.querySelectorAll('[placeholder],[aria-label],[title],[alt],[data-confirm]')].forEach(e=>['placeholder','aria-label','title','alt','data-confirm'].forEach(a=>{const v=e.getAttribute(a);if(v&&HAN.test(v))e.setAttribute(a,trText(v))}));
}

const pmem=new Map(); let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise(res=>{try{const r=indexedDB.open('tripwallet-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
async function putPhoto(id,data){pmem.set(id,data);const db=await idb();if(!db)return;try{db.transaction('p','readwrite').objectStore('p').put(data,id)}catch(e){}}
async function getPhoto(id){if(pmem.has(id))return pmem.get(id);const db=await idb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('p').objectStore('p').get(id);q.onsuccess=()=>{if(q.result)pmem.set(id,q.result);res(q.result||null)};q.onerror=()=>res(null)}catch(e){res(null)}})}
async function delPhoto(id){pmem.delete(id);const db=await idb();try{db&&db.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}}
async function allPhotoIds(){const db=await idb();if(!db)return [...pmem.keys()];return new Promise(res=>{try{const q=db.transaction('p').objectStore('p').getAllKeys();q.onsuccess=()=>res([...new Set([...q.result,...pmem.keys()])]);q.onerror=()=>res([...pmem.keys()])}catch(e){res([...pmem.keys()])}})}
function hydrate(root){tr(root);root.querySelectorAll('img[data-photo]').forEach(async img=>{const d=await getPhoto(img.dataset.photo);if(d)img.src=d;else img.alt='照片丢失'})}
function compress(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const M=1600;const k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=()=>res(null);img.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

/* ---------- 分摊 ---------- */
function splitAmounts(total,ids,shares,cur){
  const unit=dec(cur)===0?100:1; const T=Math.round(total/unit);
  const w=ids.map(id=>shares?Math.max(0,Number(shares[id]??1)||0):1); const W=sum(w);
  if(!ids.length||W<=0) return ids.map(m=>({m,amt:0}));
  const res=ids.map((m,i)=>({m,u:Math.floor(T*w[i]/W)})); let rem=T-sum(res.map(r=>r.u));
  for(let i=0;rem>0;i=(i+1)%res.length){if(w[i]>0){res[i].u++;rem--}}
  return res.map(r=>({m:r.m,amt:r.u*unit}));
}

const DEFAULT_USD={USD:1,CNY:7.1,TMT:3.5,INR:84,EUR:0.92,GBP:0.78,JPY:150,KRW:1380,THB:34,HKD:7.8,MOP:8.05,TWD:32,SGD:1.34,MYR:4.4,VND:25000,IDR:15800,PHP:57,LAK:21000,KHR:4100,MMK:2100,AUD:1.5,CAD:1.37,AED:3.67,RUB:95,TRY:34,KZT:480,UZS:12700};
const usdOf=(t,c)=>c==='USD'?1:(Number(t.usd?.[c])||DEFAULT_USD[c]||1);
const rateOf=(t,c)=>c===t.base?1:usdOf(t,t.base)/usdOf(t,c);
function migrateRates(t){
  if(t.usd)return;
  const old=c=>Number(t.currencies.find(x=>x.code===c)?.rate)||0;
  const ub=t.base==='USD'?1:(old('USD')||DEFAULT_USD[t.base]||1);
  t.usd={USD:1,[t.base]:ub};
  t.currencies.forEach(c=>{if(c.code!==t.base&&c.code!=='USD'){const r=old(c.code);t.usd[c.code]=r>0?ub/r:(DEFAULT_USD[c.code]||1)}});
}
const fmtRate=v=>!isFinite(v)?'—':v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toPrecision(4);
// 汇率按 1 USD 显示：b 每 1 a 为 rate
function fxLine(a,b,rate){if(a==='USD')return `1 USD = ${fmtRate(rate)} ${b}`;if(b==='USD')return `1 USD = ${fmtRate(1/rate)} ${a}`;return `1 ${a} = ${fmtRate(rate)} ${b}`}
// 入钱时填写的汇率（1 USD = ? 该币；若存的就是 USD，则 1 USD = ? 本位币）→ 每 1 单位折合本位币
function depRate(t,d){if(d.cur===t.base)return 1;const v=Number(d.rate);if(d.cur==='USD')return v>0?v:usdOf(t,t.base);return usdOf(t,t.base)/(v>0?v:usdOf(t,d.cur))}
const mOf=(t,id)=>t.members.find(m=>m.id===id);
const mName=(t,id)=>mOf(t,id)?.name??'(已删除)';
const mColor=(t,id)=>PAL[(mOf(t,id)?.color??0)%PAL.length];
let C=null;
function compute(t){
  const acc={},mem={},info={},ext={};
  t.members.forEach(m=>mem[m.id]={in:0,out:0,inC:{},outC:{}});
  const A=c=>acc[c]||(acc[c]={bal:0,cost:0});
  const avg=c=>{if(c===t.base)return 1;const a=A(c);return a.bal>0?a.cost/a.bal:rateOf(t,c)};
  const M=id=>mem[id]||(mem[id]={in:0,out:0,inC:{},outC:{}});
  t.currencies.forEach(c=>A(c.code));
  for(const x of live(t).sort(byTime)){
    if(x.type==='deposit'){
      const r=x.cur===t.base?1:(Number(x.rate)||rateOf(t,x.cur)); const a=A(x.cur);
      a.bal+=x.amount;a.cost+=x.amount*r;
      x.splits.forEach(s=>{const m=M(s.m);m.in+=s.amt*r;m.inC[x.cur]=(m.inC[x.cur]||0)+s.amt});
      if(x.src==='ext'){const k=x.srcName||'外部来源';ext[k]=(ext[k]||0)+x.amount*r}
      info[x.id]={rate:r,base:x.amount*r};
    }else if(x.type==='expense'){
      const a=A(x.cur);
      if(x.advBy){const r0=avg(x.cur);a.bal+=x.amount;a.cost+=x.amount*r0;const m=M(x.advBy);m.in+=x.amount*r0;m.inC[x.cur]=(m.inC[x.cur]||0)+x.amount}
      const r=avg(x.cur); a.bal-=x.amount;a.cost-=x.amount*r;
      x.splits.forEach(s=>{const m=M(s.m);m.out+=s.amt*r;m.outC[x.cur]=(m.outC[x.cur]||0)+s.amt});
      info[x.id]={rate:r,base:x.amount*r};
    }else if(x.type==='exchange'){
      const r=avg(x.fromCur),v=x.fromAmt*r; const f=A(x.fromCur),to=A(x.toCur);
      f.bal-=x.fromAmt;f.cost-=v;to.bal+=x.toAmt;to.cost+=v;
      info[x.id]={rate:x.toAmt/x.fromAmt,base:v};
    }
  }
  const pool=sum(Object.values(acc).map(a=>a.cost));
  const spent=sum(live(t).filter(x=>x.type==='expense').map(x=>info[x.id].base));
  const deposited=sum(Object.values(mem).map(m=>m.in))+sum(Object.values(ext));
  return {acc,mem,info,ext,pool,spent,deposited,avg:c=>c===t.base?1:(acc[c]&&acc[c].bal>0?acc[c].cost/acc[c].bal:rateOf(t,c))};
}
function settle(t){
  const ppl=t.members.map(m=>({name:m.name,id:m.id,b:Math.round(C.mem[m.id].in-C.mem[m.id].out)}));
  const debt=ppl.filter(p=>p.b<0).map(p=>({name:p.name,id:p.id,v:-p.b}));
  const cred=ppl.filter(p=>p.b>0).map(p=>({name:p.name,id:p.id,v:p.b}));
  Object.entries(C.ext).forEach(([k,v])=>{if(Math.round(v)>0)cred.push({name:k+'（外部）',ext:true,v:Math.round(v)})});
  const pool=Math.round(C.pool);
  if(pool>0)debt.unshift({name:'钱袋剩余',pool:true,v:pool}); else if(pool<0)cred.push({name:'钱袋（透支）',pool:true,v:-pool});
  debt.sort((a,b)=>b.v-a.v);cred.sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const v=Math.min(debt[i].v,cred[j].v);if(v>=1)out.push({from:debt[i],to:cred[j],v});debt[i].v-=v;cred[j].v-=v;if(debt[i].v<1)i++;if(cred[j].v<1)j++}
  return {ppl,out,pool};
}

    category:t.categories[0]||'',advOn:false,advBy:t.members[0]?.id,time:nowLocal(),place:'',note:'',photos:[],
    fromCur:t.base,toCur:other,fromStr:'',toStr:''};
}
function draftFromTx(x,copy){
  const d=newDraft(x.type==='deposit'?'deposit':x.type==='exchange'?'exchange':(x.kind||'shared'));
  if(x.type==='exchange')Object.assign(d,{fromCur:x.fromCur,toCur:x.toCur,fromStr:String(x.fromAmt/100),toStr:String(x.toAmt/100)});
  else{

    d.per=!!(x.per&&x.splits.length);d.src=x.src||'member';d.srcName=x.srcName||'';d.amountStr=String((d.per?x.splits[0].amt:x.amount)/100);
    if(d.mode==='custom')x.splits.forEach(s=>d.custom[s.m]=String(s.amt/100));
    d.rate=x.usdIn?String(x.usdIn):x.rate&&x.cur!==T().base?String(+(x.cur==='USD'?x.rate:usdOf(T(),T().base)/x.rate).toFixed(4)):'';d.category=x.category||d.category;d.advOn=!!x.advBy;if(x.advBy)d.advBy=x.advBy;
  }

function draftCalc(d){
  const t=T();
  if(d.type==='exchange'){const f=toCents(d.fromStr),to=toCents(d.toStr);let err='';if(!(f>0)||!(to>0))err='请填写两边金额';else if(d.fromCur===d.toCur)err='请选择不同的币种';return {f,to,err}}
  const ids=orderedIds(t,d);const v=toCents(d.amountStr);let splits=[],total=v,err='';
  if(d.type==='deposit'&&d.src==='ext'){if(!(v>0))err='请填写金额';else if(!String(d.srcName||'').trim())err='请填写钱从哪来，如 公司备用金';return {ids:[],splits:[],total:v,err,ext:true}}
  if(!ids.length)err=d.type==='personal'?'请选择是谁的支出':d.type==='deposit'?'请选择谁存入':'请至少选择一个人';
  else if(d.type==='deposit'&&d.per){splits=ids.map(m=>({m,amt:v}));total=v*ids.length;if(!(v>0))err='请填写每人金额'}
  else if(d.mode==='custom'&&d.type!=='personal'){splits=ids.map(m=>({m,amt:toCents(d.custom[m])||0}));const s=sum(splits.map(x=>x.amt));if(!(v>0))err='请填写总金额';else if(s!==v)err=`各人合计 ${money(s,d.cur)}，与总额相差 ${money(v-s,d.cur)}`}

    if(!err&&d.mode==='shares'&&!splits.some(s=>s.amt>0))err='份数不能全为 0'}

function previewHTML(d){

    if(r.err)return `<div class="hint" style="padding:10px 0">${r.err}</div>`;
    const rate=r.to/r.f;const cost=C.avg(d.fromCur);const usdTerms=d.fromCur==='USD'||d.toCur==='USD';
    const prev=live(t).filter(x=>x.type==='exchange'&&x.id!==d.editId&&((x.fromCur===d.fromCur&&x.toCur===d.toCur)||(x.fromCur===d.toCur&&x.toCur===d.fromCur))).sort(byTime).pop();
    const pr=prev?(prev.fromCur===d.fromCur?prev.toAmt/prev.fromAmt:prev.fromAmt/prev.toAmt):0;
    const ref=usdOf(t,d.toCur)/usdOf(t,d.fromCur);const dp=pr?Math.abs(rate/pr-1):0,dr=Math.abs(rate/ref-1);
    let warn='';if(pr&&dp>0.05)warn=`与上次汇率相差 ${(dp*100).toFixed(0)}%，请核对金额是否填错`;else if(!pr&&dr>0.1)warn=`与参考汇率相差 ${(dr*100).toFixed(0)}%，请核对金额是否填错`;
    return `<div class="kv"><div><span>汇率</span><span class="num">${fxLine(d.fromCur,d.toCur,rate)}</span></div>${usdTerms?'':`<div><span>反向</span><span class="num">1 ${d.toCur} = ${fmtRate(1/rate)} ${d.fromCur}</span></div>`}
    ${pr?`<div><span>上次汇率</span><span class="num">${fxLine(d.fromCur,d.toCur,pr)} · ${prev.time.slice(5,10).replace('-','/')}</span></div>`:`<div><span>参考汇率</span><span class="num">${fxLine(d.fromCur,d.toCur,ref)}</span></div>`}
    <div><span>折合成本</span><span class="num">${money(r.f*cost,t.base)}</span></div>${warn?`<div class="fxwarn"><span>⚠</span><span>${warn}</span></div>`:''}</div>`;
  }
  if(r.ext){const rt=depRate(t,d);return r.err?`<div class="hint" style="padding:10px 0">${r.err}</div>`:`<div class="pr"><span class="nm">${esc(d.srcName)} 存入钱袋</span><span class="num" style="font-weight:700">${money(r.total,d.cur)}${d.cur!==t.base?` <span class="hint">≈${money(r.total*rt,t.base)}</span>`:''}</span></div><div class="pr hint">外部来源的钱不算任何成员的投入；结算时钱袋剩下的钱先还给它。</div>`}
  if(!r.ids.length)return `<div class="hint" style="padding:10px 0">${r.err}</div>`;
  const rate=d.type==='deposit'?depRate(t,d):C.avg(d.cur);
  const rows=r.ids.map(id=>{const s=r.splits.find(x=>x.m===id);const amt=s?s.amt:0;
    let ctl='';
    if(d.type!=='personal'&&!(d.type==='deposit'&&d.per)){
      if(d.mode==='shares')ctl=`<input class="in num" id="sh-${id}" data-f="shares.${id}" inputmode="none" data-calc autocomplete="off" style="width:64px;text-align:center" value="${esc(d.shares[id]??1)}" aria-label="${esc(mName(t,id))}的份数"><span class="hint">份</span>`;
      if(d.mode==='custom')ctl=`<input class="in num" id="cu-${id}" data-f="custom.${id}" inputmode="none" data-calc autocomplete="off" value="${esc(d.custom[id]??'')}" placeholder="0" aria-label="${esc(mName(t,id))}的金额">`;
    }
    return `<div class="pr">${av(t,id)}<span class="nm">${esc(mName(t,id))}</span>${ctl}<span class="num" style="min-width:90px;text-align:right" data-pv="${id}">${d.mode==='custom'&&d.type!=='personal'&&!(d.type==='deposit'&&d.per)?'':money(amt,d.cur)}</span></div>`}).join('');
  const totalLine=r.total>0?`<div class="pr"><span class="nm muted">合计</span><span class="num" style="font-weight:700">${money(r.total,d.cur)}${d.cur!==t.base?` <span class="hint">≈${money(r.total*rate,t.base)}</span>`:''}</span></div>`:'';
  return rows+totalLine+(r.err&&r.ids.length?`<div class="pr err">${r.err}</div>`:'');
}

/* ----- 结算 ----- */
SHEETS.settle=()=>{

  const left=Object.entries(C.acc).filter(([,a])=>a.bal!==0);

  ${r.pool>0?`<p class="note">「钱袋剩余」= 钱袋里还剩的钱（按成本价折合 ${money(r.pool,t.base)}）。直接从钱袋拿出来给对应的人即可。</p>`:''}</div>
  ${left.length?`<div class="card"><h4>钱袋里剩的钱</h4><div class="kv">${left.map(([c,a])=>`<div><span>${c} ${cname(c)}</span><span class="num">${money(a.bal,c)}${c!==t.base?` <span class="hint">≈${money(a.cost,t.base)}</span>`:''}</span></div>`).join('')}</div><p class="note">外币可以先换回${cname(t.base)}（记一笔换汇）再结算，结果会按实际换回的钱更新。</p></div>`:''}

function csvOf(t){

  const rows=[['编号','时间','类型','类别','币种','金额','折合'+t.base,'参与人/分摊','垫付人','地点','备注','照片数'].map(L)];

    if(x.type==='exchange')rows.push([x.id,x.time.replace('T',' '),L('换汇'),'',`${x.fromCur}→${x.toCur}`,`${x.fromAmt/100}→${x.toAmt/100}`,((i.base||0)/100).toFixed(2),'','',x.place,x.note,x.photos?.length||0]);
    else rows.push([x.id,x.time.replace('T',' '),L(x.type==='deposit'?'入钱':x.kind==='personal'?'个人支出':'共同支出'),L(x.category||''),x.cur,x.amount/100,((i.base||0)/100).toFixed(2),x.splits.map(s=>`${mName(t,s.m)}:${s.amt/100}`).join(' / '),x.advBy?mName(t,x.advBy):'',x.place,x.note,x.photos?.length||0])});
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\n');
}

/* ----- A4 账单 ----- */
function stmtData(t,d){
  const sc=d.scope||'pool';let unit=t.base,title;
  const typeOf=x=>x.type==='deposit'?(x.src==='ext'?'外部入钱':'入钱'):x.type==='exchange'?'换汇':x.kind==='personal'?'个人支出':'共同支出';
  const descOf=x=>[x.type==='expense'?x.category:'',x.note||(x.type==='expense'?'':txTitle(t,x)),x.place].filter(Boolean).join(' · ');
  const whoOf=x=>x.type==='deposit'?(x.src==='ext'?(x.srcName||'外部'):x.splits.map(s=>mName(t,s.m)).join('、')):x.type==='expense'?(x.kind==='personal'?mName(t,x.splits[0]?.m):x.splits.map(s=>mName(t,s.m)).join('、')):'';
  const rows=[];
  if(sc==='pool')title='钱袋总账';else if(sc.startsWith('cur:')){unit=sc.slice(4);title=`钱袋 ${unit} ${cname(unit)} 账户`}else title=`${mName(t,sc.slice(2))} 个人账单`;
  for(const x of live(t).sort(byTime)){
    const i=C.info[x.id]||{rate:1,base:0};let inn=0,out=0,orig='',orig2='',type=typeOf(x);
    if(sc==='pool'){
      if(x.type==='deposit'){inn=i.base;orig=money(x.amount,x.cur)}
      else if(x.type==='expense'){out=i.base;orig=money(x.amount,x.cur);if(x.advBy){inn=x.amount*i.rate;orig2=`${mName(t,x.advBy)} 垫付`}}
      else orig=`${money(x.fromAmt,x.fromCur)} → ${money(x.toAmt,x.toCur)}`;
    }else if(sc.startsWith('cur:')){
      if(x.type==='deposit'&&x.cur===unit)inn=x.amount;
      else if(x.type==='expense'&&x.cur===unit){out=x.amount;if(x.advBy){inn=x.amount;orig2=`${mName(t,x.advBy)} 垫付`}}
      else if(x.type==='exchange'&&x.fromCur===unit){out=x.fromAmt;orig=`换得 ${money(x.toAmt,x.toCur)}`}
      else if(x.type==='exchange'&&x.toCur===unit){inn=x.toAmt;orig=`付出 ${money(x.fromAmt,x.fromCur)}`}
      else continue;
    }else{
      const mid=sc.slice(2);const sp=(x.splits||[]).find(s=>s.m===mid);
      if(x.type==='deposit'){if(!sp)continue;inn=sp.amt*i.rate;orig=money(sp.amt,x.cur)}
      else if(x.type==='expense'){if(!sp&&x.advBy!==mid)continue;
        if(sp){out=sp.amt*i.rate;orig=money(sp.amt,x.cur);if(x.splits.length>1)orig2=`共 ${money(x.amount,x.cur)} · ${x.splits.length}人`}
        if(x.advBy===mid){inn=x.amount*i.rate;orig2=(orig2?orig2+' · ':'')+`本人垫付 ${money(x.amount,x.cur)}`}}
      else continue;
    }
    rows.push({x,time:x.time,type,desc:descOf(x),who:whoOf(x),orig,orig2,inn,out});
  }
  let open=0;const list=[];
  for(const r of rows){const day=r.time.slice(0,10);if(d.from&&day<d.from){open+=r.inn-r.out;continue}if(d.to&&day>d.to)continue;list.push(r)}
  let bal=open;list.forEach(r=>{bal+=r.inn-r.out;r.bal=bal});
  return {title,unit,rows:list,open,totIn:sum(list.map(r=>r.inn)),totOut:sum(list.map(r=>r.out)),close:bal,member:sc.startsWith('m:')};
}
function stmtParts(t,d){
  if(d.scope==='all')return [{...d,scope:'pool'},...t.members.map(m=>({...d,scope:'m:'+m.id}))];
  if(d.scope==='days')return reportDays(t,d).map(day=>({...d,scope:'pool',from:day,to:day,title:'日报 · '+dayLabel(day),day}));
  return [d];
}
function reportDays(t,d){return [...new Set(live(t).map(x=>x.time.slice(0,10)))].filter(x=>(!d.from||x>=d.from)&&(!d.to||x<=d.to)).sort()}
const a4Tag=x=>x.type==='deposit'?(x.src==='ext'?['t-in','外部入钱']:['t-in','存入']):x.type==='exchange'?['t-fx','换币']:x.kind==='personal'?['t-me','个人']:['t-sh','共同'];

function a4Range(t,d){if(d.day)return '';if(!d.from&&!d.to)return dateRange(t);if(d.from&&d.from===d.to)return dayLabel(d.from);return `${d.from?dayLabel(d.from):'开始'} 至 ${d.to?dayLabel(d.to):'现在'}`}

function poolTable(s,d){const u=s.unit;

  <tr class="tot"><td></td><td colspan="4">合计</td><td class="n in">${money(s.totIn,u)}</td><td class="n out">${money(s.totOut,u)}</td><td class="n">${money(s.close,u)}</td></tr></tbody></table>`;

function memberTable(s){const u=s.unit;const sp=s.rows.filter(r=>r.out>0);let cum=0;sp.forEach(r=>{cum+=r.out;r.cum=cum});

  ${sp.length?`<tr class="tot"><td></td><td colspan="3">花费合计</td><td class="n out">${money(s.totOut,u)}</td><td class="n">${money(cum,u)}</td></tr>`:''}</tbody></table>`;

/* 按币种分开记账：每种货币用自己的钱记入、出、余额；换汇在两个账户各记一笔 */
const numC=(v,c)=>(Math.round(v)<0?'−':'')+fmtN(Math.round(v),c);
function usedCurs(t,d){const set=new Set();live(t).forEach(x=>{const day=x.time.slice(0,10);if(d.to&&day>d.to)return;[x.cur,x.fromCur,x.toCur].forEach(c=>c&&set.add(c))});return t.currencies.map(c=>c.code).filter(c=>set.has(c))}
function curLedgers(t,d){

    <tr class="tot"><td></td><td colspan="3">合计</td><td class="n in">${numC(s.totIn,c)}</td><td class="n out">${numC(s.totOut,c)}</td><td class="n">${numC(s.close,c)}</td></tr></tbody></table></div>`}).join('');
}
function docPool(t,d,withMembers){
  const s=stmtData(t,d),u=s.unit;
  let h=`<div class="a4">${a4Head(t,d.title||s.title,d,u,`${s.rows.length} 笔 · ${t.members.length} 人`)}

function photoPages(t,parts){

    r.x.photos.forEach((ph,k)=>items.push({ph,cap:`${r.time.slice(8,10)}.${r.time.slice(5,7)} ${hm(r.time)} · ${[r.desc||txTitle(t,r.x)].join('')} · ${r.orig||money(r.x.amount||0,r.x.cur||t.base)}${r.x.photos.length>1?` · ${k+1}/${r.x.photos.length}`:''}`}))}}
  if(!items.length)return `<div class="a4"><div class="hd"><div><h1>${esc(t.name)}</h1><div class="sub">小票照片</div></div></div><div class="fine">这些记录没有照片。</div></div>`;

}

function stmtTSV(t,d){

    $('#f-photos',s.body).innerHTML=photosHTML(s.data);hydrate(s.body);toast(`已添加 ${files.length} 张`);return}
  if(el.dataset.file==='bk'){const f=el.files[0];if(!f)return;$('#bk-in').value=await f.text();toast('已读取，点「恢复」确认')}
});

/* ---------- 外观：默认白色 ---------- */
function applyTheme(){const v=S?.theme||'light';if(v==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',v==='dark'?'#07080C':'#FFFFFF')}

addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>8),{passive:true});

/* ---------- 按键震动 ---------- */
function buzz(force){if(S?.haptic===false&&!force)return;try{if(window.AndroidBridge&&AndroidBridge.haptic)AndroidBridge.haptic();else if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-ck],[data-pk],[data-a],.sugs [data-sv]'))buzz()},true);

/* ---------- 计算器键盘 ---------- */
let calcEl=null;
const CALC_KEYS=[['C','(',')','⌫'],['7','8','9','÷'],['4','5','6','×'],['1','2','3','-'],['.','0','=','+']];
function calcShow(el){
  calcEl=el;const c=$('#calc');
  c.innerHTML=`<div class="in-wrap" translate="no"><div class="disp"><span class="expr" id="c-expr"></span><span class="res num" id="c-res"></span><button class="done" data-ck="ok">${LANG==='tk'?'Taýýar':'完成'}</button></div><div class="keys">${CALC_KEYS.flat().map(k=>`<button data-ck="${k}" class="${'+-×÷()'.includes(k)?'op':k==='='?'eq':''}">${k==='-'?'−':k}</button>`).join('')}</div></div>`;
  c.hidden=false;document.body.classList.add('calc-open');calcUpd();
  setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),60);
}
function calcHide(){$('#calc').hidden=true;document.body.classList.remove('calc-open');calcEl=null}
function calcVal(v){const c=toCents(v);return Number.isFinite(c)?c/100:NaN}
function calcUpd(){if(!calcEl)return;const v=calcEl.value;const r=calcVal(v);$('#c-expr').textContent=v||'0';$('#c-res').textContent=/[+\-×÷*/()]/.test(v)?(Number.isFinite(r)?'= '+(+r.toFixed(2)).toLocaleString('en-US',{maximumFractionDigits:2}):'= ?'):''}
function calcFire(el,change){el.dispatchEvent(new Event('input',{bubbles:true}));if(change)el.dispatchEvent(new Event('change',{bubbles:true}))}
function calcKey(k){
  const el=calcEl;if(!el)return;
  if(k==='ok'){const r=calcVal(el.value);if(el.value&&/[+\-×÷*/()]/.test(el.value)&&Number.isFinite(r)){el.value=String(+r.toFixed(2));calcFire(el)}calcFire(el,true);el.blur();calcHide();return}
  let v=el.value,a=el.selectionStart??v.length,b=el.selectionEnd??v.length;
  if(k==='C'){v='';a=b=0}
  else if(k==='⌫'){if(a===b&&a>0)a--;v=v.slice(0,a)+v.slice(b);b=a}
  else if(k==='='){const r=calcVal(v);if(Number.isFinite(r)){v=String(+r.toFixed(2));a=b=v.length}}
  else{v=v.slice(0,a)+k+v.slice(b);a=b=a+k.length}
  el.value=v;try{el.setSelectionRange(a,a)}catch(e){}
  calcFire(el);calcEl=document.getElementById(el.id)||el;if(calcEl!==el){calcEl.focus();try{calcEl.setSelectionRange(a,a)}catch(e){}}
  calcUpd();
}
document.addEventListener('focusin',e=>{const el=e.target;if(el.matches?.('input[data-calc]')){if(calcEl!==el)calcShow(el);else calcUpd()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(calcEl&&document.activeElement!==calcEl&&!document.activeElement?.matches?.('input[data-calc]')){calcFire(calcEl,true);calcHide()}},120));
$('#calc').addEventListener('pointerdown',e=>{if(e.target.closest('[data-ck]'))e.preventDefault()});
$('#calc').addEventListener('click',e=>{const b=e.target.closest('[data-ck]');if(b)calcKey(b.dataset.ck)});
document.addEventListener('input',e=>{if(e.target===calcEl)calcUpd()});

/* ---------- 以前填过的内容：显示在输入框下方，不盖住键盘 ---------- */
let sugEl=null;
function sugList(key,q){const t=T();q=(q||'').trim().toLowerCase();
  return [...new Set(t.txs.slice().sort(byTime).reverse().map(x=>x[key]).filter(Boolean))].filter(v=>v.toLowerCase()!==q&&(!q||v.toLowerCase().includes(q))).slice(0,8)}
function sugShow(el){
  sugEl=el;let box=el.parentElement.querySelector('.sugs');
  const vals=sugList(el.dataset.sug,el.value);
  if(!vals.length){box&&box.remove();return}
  if(!box){box=document.createElement('div');box.className='sugs';box.setAttribute('translate','no');el.after(box)}
  box.innerHTML=vals.map(v=>`<button type="button" data-sv="${esc(v)}">${esc(v)}</button>`).join('');
}
function sugHide(){document.querySelectorAll('.sugs').forEach(b=>b.remove());sugEl=null}
document.addEventListener('focusin',e=>{const el=e.target;if(el.matches?.('input[data-sug]')){sugShow(el);setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),350)}});
document.addEventListener('input',e=>{if(e.target===sugEl)sugShow(sugEl)});
document.addEventListener('focusout',e=>{if(e.target===sugEl)setTimeout(()=>{if(document.activeElement!==sugEl)sugHide()},150)});
document.addEventListener('pointerdown',e=>{if(e.target.closest('.sugs [data-sv]'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('.sugs [data-sv]');if(!b||!sugEl)return;sugEl.value=b.dataset.sv;sugEl.dispatchEvent(new Event('input',{bubbles:true}));sugHide()});

/* ---------- 密码锁 ---------- */
let pinBuf='',pinFails=0,pinWait=0,hiddenAt=0;
const bioOK=()=>!!(window.AndroidBridge&&AndroidBridge.hasBiometric&&AndroidBridge.hasBiometric());
async function pinHash(pin,salt){
  const txt=salt+':'+pin;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=2166136261;for(const ch of txt){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16)}
}
function lockDraw(msg=''){
  const L2=(zh,tk)=>LANG==='tk'?tk:zh;
  $('#lock').innerHTML=`<h2>${L2('出差钱袋','Iş sapary gapjygy')}</h2><div>${L2('请输入密码','Paroly giriziň')}</div>
  <div class="dots">${[0,1,2,3,4,5].slice(0,Math.max(4,S.lock.len||4)).map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div><div class="msg">${msg}</div>
  <div class="pad">${['1','2','3','4','5','6','7','8','9','bio','0','del'].map(k=>k==='bio'?(S.lock.bio&&bioOK()?`<button class="t" data-pk="bio">${L2('指纹','Barmak yzy')}</button>`:'<span></span>'):k==='del'?`<button class="t" data-pk="del">${L2('删除','Poz')}</button>`:`<button data-pk="${k}">${k}</button>`).join('')}</div>
  <button class="lk-link" data-pk="forgot">${L2('忘记密码？','Paroly ýatdan çykardyňyzmy?')}</button>`;
}
function lockShow(){if(!S.lock)return;pinBuf='';const l=$('#lock');l.hidden=false;lockDraw();if(S.lock.bio&&bioOK())setTimeout(()=>AndroidBridge.biometric(LANG==='tk'?'Gapjygy açmak':'解锁出差钱袋',LANG==='tk'?'Parol bilen':'用密码'),300)}
function lockHide(){$('#lock').hidden=true;pinBuf=''}
window.__bio=ok=>{if(ok)lockHide()};
$('#lock').addEventListener('click',async e=>{
  const b=e.target.closest('[data-pk]');if(!b)return;const k=b.dataset.pk;const tk=LANG==='tk';
  if(k==='bio'){AndroidBridge.biometric(tk?'Gapjygy açmak':'解锁出差钱袋',tk?'Parol bilen':'用密码');return}
  if(k==='forgot'){lockDraw(tk?'Paroly dikeldip bolmaýar. Diňe programmany pozup täzeden gurmaly (maglumatlar pozular), soň ätiýaçlykdan dikeldiň.':'密码无法找回。只能卸载重装（账目会清空），再用备份恢复。');return}
  if(Date.now()<pinWait){lockDraw(tk?'Biraz garaşyň…':'请稍等再试…');return}
  if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<6)pinBuf+=k;
  lockDraw();
  if(pinBuf.length===(S.lock.len||4)){
    if(await pinHash(pinBuf,S.lock.salt)===S.lock.hash){pinFails=0;lockHide()}
    else{pinFails++;pinBuf='';const l=$('#lock');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');
      if(pinFails>=5){pinWait=Date.now()+30000;pinFails=0;lockDraw(tk?'Köp ýalňyş: 30 sekunt garaşyň':'错误太多，请 30 秒后再试')}else lockDraw(tk?'Parol nädogry':'密码不对')}
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(S?.lock&&hiddenAt&&Date.now()-hiddenAt>60000)lockShow()});
SHEETS['pin-set']=d=>head(S.lock?'修改密码':'设置密码')+`<div class="card" style="display:flex;flex-direction:column;gap:10px">
  <label class="fl">新密码（4–6 位数字）<input class="in num" type="password" inputmode="numeric" maxlength="6" id="pin1" autocomplete="new-password"></label>
  <label class="fl">再输一次<input class="in num" type="password" inputmode="numeric" maxlength="6" id="pin2" autocomplete="new-password"></label>
  ${bioOK()?`<label class="sw"><input type="checkbox" id="pin-bio" checked>同时允许指纹解锁</label>`:''}
  <p class="note">密码忘了无法找回，只能卸载重装后用备份恢复。设置前建议先备份。</p>
  <button class="btn" data-a="pin-save">保存密码</button></div>`;

/* ---------- 启动 ---------- */
async function boot(){
  S=load();LANG=S?.lang||'zh';
  if(S){S.trips.forEach(migrateRates);if(!S.firstUse){S.firstUse=Date.now();save(true)}}
  if(!S){S=seed('zh');S.firstUse=Date.now();save(true);putPhoto('demo-receipt',demoReceipt())}
  else if(S.trips.some(t=>t.txs.some(x=>x.photos?.includes('demo-receipt')))&&!(await getPhoto('demo-receipt')))putPhoto('demo-receipt',demoReceipt());
  applyTheme();render();
  if(S.lock)lockShow();
  const h=location.hash.slice(1);if(h){const x=T().txs.find(y=>y.id===h);if(x)openSheet('tx',{id:h})}
}
window.__back=()=>{
  // 先收键盘：计算器键盘或正在输入的文字框，只收起键盘，不关页面
  if(calcEl){calcFire(calcEl,true);calcEl.blur();calcHide();return true}
  const ae=document.activeElement;if(ae&&ae.matches?.('input:not([type=checkbox]):not([type=file]),textarea,select')){ae.blur();sugHide();return true}
  if(viewer){ACT['v-close']();return true}if(sheets.length){closeSheet();return true}if(tab!=='home'){tab='home';render();return true}return false};
boot();
})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.AndroidBridge)navigator.serviceWorker.register('sw.js').catch(()=>{});
