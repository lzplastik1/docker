<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0C6A56"><meta name="apple-mobile-web-app-title" content="出差钱袋"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>出差钱袋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column; sticky trip header, glass tab bar, bottom sheets. Deep emerald gradients with champagne-gold highlights. */
:root{
  --bg:#EDF1EF; --bg2:#E3EBE7; --surface:#FFFFFF; --surface2:#F3F6F5; --ink:#0F1F1A; --muted:#5B6B65; --line:#DCE4E0;
  --accent:#0E6B57; --accent-2:#17977B; --accent-soft:#DDEFE8; --on-accent:#FFFFFF;
  --gold:#B98A3A; --gold-soft:#F6EBD6;
  --g1:#052A24; --g2:#0C5747; --g3:#169078; --glow:rgba(226,190,120,.42); --on-hero:#F3FBF8; --hero-mute:rgba(243,251,248,.72);
  --glass:rgba(255,255,255,.80); --glass-line:rgba(15,31,26,.08);
  --pos:#18794A; --neg:#B5363A; --warn:#9A5716; --warn-soft:#F7EAD8;
  --scrim:rgba(6,20,16,.5);
  --shadow:0 1px 1px rgba(10,40,30,.04),0 2px 6px rgba(10,40,30,.05),0 12px 28px -12px rgba(10,40,30,.14);
  --shadow-hero:0 22px 44px -22px rgba(5,42,36,.75),0 8px 18px -10px rgba(5,42,36,.4);
  --f-display:"Sora",-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08100D; --bg2:#0C1713; --surface:#111B17; --surface2:#17231E; --ink:#E5EEEA; --muted:#8EA199; --line:#22312B;
  --accent:#46C3A0; --accent-2:#2BA586; --accent-soft:#163A2F; --on-accent:#04140F;
  --gold:#DDB672; --gold-soft:#3A2F1C;
  --g1:#03201A; --g2:#0A4639; --g3:#147D67; --glow:rgba(221,182,114,.30); --on-hero:#F3FBF8; --hero-mute:rgba(243,251,248,.7);
  --glass:rgba(17,27,23,.82); --glass-line:rgba(255,255,255,.06);
  --pos:#55C98A; --neg:#F27A7A; --warn:#E8A35E; --warn-soft:#3A2A19;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);
  --shadow-hero:0 22px 44px -22px rgba(0,0,0,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08100D; --bg2:#0C1713; --surface:#111B17; --surface2:#17231E; --ink:#E5EEEA; --muted:#8EA199; --line:#22312B;
  --accent:#46C3A0; --accent-2:#2BA586; --accent-soft:#163A2F; --on-accent:#04140F;
  --gold:#DDB672; --gold-soft:#3A2F1C;
  --g1:#03201A; --g2:#0A4639; --g3:#147D67; --glow:rgba(221,182,114,.30); --on-hero:#F3FBF8; --hero-mute:rgba(243,251,248,.7);
  --glass:rgba(17,27,23,.82); --glass-line:rgba(255,255,255,.06);
  --pos:#55C98A; --neg:#F27A7A; --warn:#E8A35E; --warn-soft:#3A2A19;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);
  --shadow-hero:0 22px 44px -22px rgba(0,0,0,.85); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,var(--bg2),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--glass-line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.trip-btn{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.trip-btn b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-btn span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.grey{background:var(--surface2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
main.wrap{padding-block:14px 150px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--glass-line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:8px 2px -4px}
.sec-t h3{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:4px}

/* 钱袋主卡：渐变 + 金色光晕 + 细纹 */
.hero{position:relative;overflow:hidden;isolation:isolate;color:var(--on-hero);border-radius:26px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(110% 80% at 105% -10%,var(--glow),transparent 55%),radial-gradient(80% 70% at -10% 120%,rgba(23,151,123,.55),transparent 60%),linear-gradient(145deg,var(--g1) 0%,var(--g2) 52%,var(--g3) 100%);
  box-shadow:var(--shadow-hero)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.12;background:repeating-linear-gradient(115deg,rgba(255,255,255,.5) 0 1px,transparent 1px 14px);-webkit-mask-image:linear-gradient(200deg,#000,transparent 65%);mask-image:linear-gradient(200deg,#000,transparent 65%)}
.hero .lbl{font-size:12px;color:var(--hero-mute);letter-spacing:.08em}
.hero .big{font-size:38px;font-weight:700;line-height:1.08;letter-spacing:-.03em;background:linear-gradient(92deg,#FFFFFF 30%,#F1DDB0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .row{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--hero-mute)}
.hero .row b{font-family:var(--f-display);font-weight:600;color:var(--on-hero)}
.hero .acts{display:flex;gap:10px}
.hero .acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:14px;font-weight:700;font-size:15px;color:var(--on-hero);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero .acts button i{font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#F3DFB2,#C9994A);color:#3B2A0C;font-size:13px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#F3DFB2,#D3A453);border-radius:9px}
.bar.over i{background:linear-gradient(90deg,#FFB4A8,#F06A5A)}
.src{display:flex;flex-wrap:wrap;gap:6px}
.src span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.src span b{font-weight:600}

.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acct{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--surface) 40%,var(--surface2));border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;width:100%}
.acct::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent-2),var(--gold))}
.acct .c{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.acct .v{font-size:19px;font-weight:600;overflow-wrap:anywhere}
.acct .r{font-size:11px;color:var(--muted)}
.acct.neg-b{border-color:var(--neg)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{background:var(--surface);border:1px solid var(--glass-line);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;text-align:left}
.quick button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.quick .ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--accent-2),var(--g2))}
.quick .ic.gold{background:linear-gradient(135deg,#E6C27F,#A9782E)}
.rows{display:flex;flex-direction:column}
.txr{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.rows .txr:last-child{border-bottom:0}
.ic-sq{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;background-image:linear-gradient(140deg,rgba(255,255,255,.28),rgba(0,0,0,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.txr .mid{flex:1;min-width:0}
.txr .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.txr .t1 span.n{overflow:hidden;text-overflow:ellipsis}
.txr .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txr .rt{text-align:right;flex:none;max-width:48%}
.txr .a1{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.txr .a2{font-size:11px;color:var(--muted)}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;padding:14px 2px 4px;letter-spacing:.03em}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;background-image:linear-gradient(140deg,rgba(255,255,255,.3),rgba(0,0,0,.2))}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.rows .mrow:last-child{border-bottom:0}
.mrow .nm{flex:1;min-width:0;font-weight:600}
.mrow .sub{font-size:12px;color:var(--muted);font-weight:400}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px);border-top:1px solid var(--glass-line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent-2),var(--gold))}
.fab{position:fixed;z-index:7;right:max(18px,calc(50% - 262px),env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border-radius:28px;border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;
  background:radial-gradient(90% 120% at 100% 0%,rgba(241,221,176,.45),transparent 60%),linear-gradient(135deg,var(--g3),var(--g1));box-shadow:0 14px 30px -10px rgba(5,42,36,.6)}
.fab b{font-size:24px;line-height:1;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip .av{width:22px;height:22px;font-size:11px}
.chip.off .av{filter:grayscale(1);opacity:.5}
.seg{display:flex;background:var(--surface2);border:1px solid var(--glass-line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 4px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;font-weight:700;box-shadow:0 6px 14px -8px rgba(14,107,87,.8)}
.filters{display:flex;flex-direction:column;gap:10px}
.filters .seg{overflow-x:auto;scrollbar-width:none}
.filters .seg button{flex:1 0 auto;padding-inline:10px}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow>*{flex:1;min-width:120px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
label.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
.ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.in{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow-y:auto;border-radius:24px 24px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(24px);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;box-shadow:0 -20px 40px -20px rgba(0,0,0,.35)}
.sheet.wide{max-width:900px}
.ov.in .sheet{transform:none}
@media (prefers-reduced-motion:reduce){.ov,.sheet{transition:none}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.sh-head::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
.sh-head h2{flex:1;margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em;text-wrap:balance}
.x{border:0;background:var(--surface2);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.amt{display:flex;gap:8px;align-items:stretch}
.amt select{flex:none;width:auto;font-weight:600}
.amt input{flex:1;font-family:var(--f-display);font-size:26px;font-weight:600;padding:8px 12px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.prev{background:var(--surface);border:1px solid var(--glass-line);border-radius:16px;padding:4px 14px}
.prev .pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prev .pr:last-child{border-bottom:0}
.prev .pr .nm{flex:1}
.prev .pr input{width:110px;text-align:right}
.err{color:var(--neg);font-size:13px;font-weight:600}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:700;font-size:16px;color:#fff;width:100%;background:radial-gradient(90% 140% at 100% 0%,rgba(241,221,176,.35),transparent 60%),linear-gradient(135deg,var(--g3),var(--g2));box-shadow:0 12px 24px -14px rgba(5,42,36,.8)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn2{border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ink)}
.btn2.danger{color:var(--neg)}
.btn2.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2);border:0;padding:0;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.ph.add{display:grid;place-items:center;border:1.5px dashed var(--line);background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;text-align:center}
.ph.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv>div:last-child{border-bottom:0}
.kv>div>span:first-child{color:var(--muted);flex:none}
.kv>div>span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.d-amt{text-align:center;padding:8px 0 2px}
.d-amt .v{font-size:34px;font-weight:700}
.statbar{display:flex;flex-direction:column;gap:10px}
.sb{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;font-size:13px}
.sb .tr{height:10px;background:var(--surface2);border-radius:9px;overflow:hidden}
.sb .tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.sb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:12px}
.scroll-x{overflow-x:auto}
.xfer{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.xfer:last-child{border-bottom:0}
.xfer .ar{color:var(--muted)}
.xfer .v{margin-left:auto;font-weight:700}
.viewer{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.viewer .vt{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.viewer .vt button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-weight:600}
.viewer .vs{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.viewer .vs img{max-width:100%;max-height:100%;object-fit:contain}
.viewer.zoom .vs{display:block}
.viewer.zoom .vs img{max-width:none;max-height:none;width:200%}
.viewer .nav{display:flex;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

const TKK=Object.keys(TK).filter(k=>k.length>1).sort((a,b)=>b.length-a.length);
const HAN=/[一-鿿]/;
function trText(s){
  if(LANG!=='tk'||s==null||!HAN.test(s))return s;
  const t=String(s).trim();
  if(TK[t]!=null)return String(s).replace(t,TK[t]);
  let r=t;
  for(const [re,rep] of TKP){if(re.test(r)){r=r.replace(re,rep);break}}
  for(const k of TKK)if(r.includes(k))r=r.split(k).join(TK[k]);
  r=r.replace(/(?:钱袋|Gapjyk) ([A-Z]{3}) (.+?) 账户/g,'Gapjyk: $1 ($2) hasaby').replace(/(^|[\s（(·/])共 /g,'$1jemi ').replace(/· 总 /g,'· jemi ').replace(/^占 /,'Paýy ').replace(/ · 按 1/g,' · kurs 1').replace(/ 至 /g,' – ')
     .replace(/(\d+)\s*笔相关/g,'$1 degişli ýazgy').replace(/(\d+)\s*人/g,'$1 adam').replace(/(\d+)\s*笔/g,'$1 ýazgy').replace(/(\d+)\s*份/g,'$1 paý').replace(/(\d+)\s*天/g,'$1 gün').replace(/(\d+)\s*张/g,'$1 surat')
     .replace(/（/g,' (').replace(/）/g,')').replace(/，/g,', ').replace(/。/g,'. ').replace(/：/g,': ').replace(/；/g,'; ').replace(/、/g,', ').replace(/「|“/g,'«').replace(/」|”/g,'»')
     .replace(/\(\s+/g,'(').replace(/\s+\)/g,')').replace(/ {2,}/g,' ').trim();
  return String(s).replace(t,r);
}
const L=s=>trText(s);
function tr(root){
  if(LANG!=='tk'||!root)return;
  if(root===document.body||root.contains?.($('#hdr')))document.title=trText(document.title);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];let n;
  while(n=w.nextNode()){if(HAN.test(n.nodeValue)&&!n.parentElement.closest('script,style,textarea,[translate="no"]'))ns.push(n)}
  ns.forEach(n=>n.nodeValue=trText(n.nodeValue));
  if(root.querySelectorAll)[root,...root.querySelectorAll('[placeholder],[aria-label],[title],[alt],[data-confirm]')].forEach(e=>['placeholder','aria-label','title','alt','data-confirm'].forEach(a=>{const v=e.getAttribute(a);if(v&&HAN.test(v))e.setAttribute(a,trText(v))}));
}

/* ---------- 分摊 ---------- */
function splitAmounts(total,ids,shares,cur){
  const unit=dec(cur)===0?100:1; const T=Math.round(total/unit);
  const w=ids.map(id=>shares?Math.max(0,Number(shares[id]??1)||0):1); const W=sum(w);
  if(!ids.length||W<=0) return ids.map(m=>({m,amt:0}));
  const res=ids.map((m,i)=>({m,u:Math.floor(T*w[i]/W)})); let rem=T-sum(res.map(r=>r.u));
  for(let i=0;rem>0;i=(i+1)%res.length){if(w[i]>0){res[i].u++;rem--}}
  return res.map(r=>({m:r.m,amt:r.u*unit}));
}

/* ---------- 计算（按时间顺序，外币按加权平均成本折算） ---------- */
const T=()=>S.trips.find(t=>t.id===S.cur)||S.trips[0];
const live=t=>t.txs.filter(x=>!x.deleted);
const byTime=(a,b)=>a.time<b.time?-1:a.time>b.time?1:(a.created||0)-(b.created||0);
const rateOf=(t,c)=>c===t.base?1:(Number(t.currencies.find(x=>x.code===c)?.rate)||1);
const mOf=(t,id)=>t.members.find(m=>m.id===id);
const mName=(t,id)=>mOf(t,id)?.name??'(已删除)';
const mColor=(t,id)=>PAL[(mOf(t,id)?.color??0)%PAL.length];
let C=null;
function compute(t){
  const acc={},mem={},info={},ext={};
  t.members.forEach(m=>mem[m.id]={in:0,out:0,inC:{},outC:{}});
  const A=c=>acc[c]||(acc[c]={bal:0,cost:0});
  const avg=c=>{if(c===t.base)return 1;const a=A(c);return a.bal>0?a.cost/a.bal:rateOf(t,c)};
  const M=id=>mem[id]||(mem[id]={in:0,out:0,inC:{},outC:{}});
  t.currencies.forEach(c=>A(c.code));
  for(const x of live(t).sort(byTime)){
    if(x.type==='deposit'){
      const r=x.cur===t.base?1:(Number(x.rate)||rateOf(t,x.cur)); const a=A(x.cur);
      a.bal+=x.amount;a.cost+=x.amount*r;
      x.splits.forEach(s=>{const m=M(s.m);m.in+=s.amt*r;m.inC[x.cur]=(m.inC[x.cur]||0)+s.amt});
      if(x.src==='ext'){const k=x.srcName||'外部来源';ext[k]=(ext[k]||0)+x.amount*r}
      info[x.id]={rate:r,base:x.amount*r};
    }else if(x.type==='expense'){
      const a=A(x.cur);
      if(x.advBy){const r0=avg(x.cur);a.bal+=x.amount;a.cost+=x.amount*r0;const m=M(x.advBy);m.in+=x.amount*r0;m.inC[x.cur]=(m.inC[x.cur]||0)+x.amount}
      const r=avg(x.cur); a.bal-=x.amount;a.cost-=x.amount*r;
      x.splits.forEach(s=>{const m=M(s.m);m.out+=s.amt*r;m.outC[x.cur]=(m.outC[x.cur]||0)+s.amt});
      info[x.id]={rate:r,base:x.amount*r};
    }else if(x.type==='exchange'){
      const r=avg(x.fromCur),v=x.fromAmt*r; const f=A(x.fromCur),to=A(x.toCur);
      f.bal-=x.fromAmt;f.cost-=v;to.bal+=x.toAmt;to.cost+=v;
      info[x.id]={rate:x.toAmt/x.fromAmt,base:v};
    }
  }
  const pool=sum(Object.values(acc).map(a=>a.cost));
  const spent=sum(live(t).filter(x=>x.type==='expense').map(x=>info[x.id].base));
  const deposited=sum(Object.values(mem).map(m=>m.in))+sum(Object.values(ext));
  return {acc,mem,info,ext,pool,spent,deposited,avg:c=>c===t.base?1:(acc[c]&&acc[c].bal>0?acc[c].cost/acc[c].bal:rateOf(t,c))};
}
function settle(t){
  const ppl=t.members.map(m=>({name:m.name,id:m.id,b:Math.round(C.mem[m.id].in-C.mem[m.id].out)}));
  const debt=ppl.filter(p=>p.b<0).map(p=>({name:p.name,id:p.id,v:-p.b}));
  const cred=ppl.filter(p=>p.b>0).map(p=>({name:p.name,id:p.id,v:p.b}));
  Object.entries(C.ext).forEach(([k,v])=>{if(Math.round(v)>0)cred.push({name:k+'（外部）',ext:true,v:Math.round(v)})});
  const pool=Math.round(C.pool);
  if(pool>0)debt.unshift({name:'钱袋剩余',pool:true,v:pool}); else if(pool<0)cred.push({name:'钱袋（透支）',pool:true,v:-pool});
  debt.sort((a,b)=>b.v-a.v);cred.sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const v=Math.min(debt[i].v,cred[j].v);if(v>=1)out.push({from:debt[i],to:cred[j],v});debt[i].v-=v;cred[j].v-=v;if(debt[i].v<1)i++;if(cred[j].v<1)j++}
  return {ppl,out,pool};
}

function filtered(t){

    if(filt.type==='exchange'&&x.type!=='exchange')return false;
    if(filt.m&&!(x.splits||[]).some(s=>s.m===filt.m)&&x.advBy!==filt.m)return false;
    if(filt.cur&&x.cur!==filt.cur&&x.fromCur!==filt.cur&&x.toCur!==filt.cur)return false;
    if(filt.day&&!x.time.startsWith(filt.day))return false;
    if(q){const hay=[x.note,x.place,x.category,'#'+x.id,txTitle(t,x)].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true}).sort(byTime).reverse();
}

function newDraft(type){

    category:t.categories[0]||'',advOn:false,advBy:t.members[0]?.id,time:nowLocal(),place:'',note:'',photos:[],
    fromCur:t.base,toCur:other,fromStr:'',toStr:''};
}
function draftFromTx(x,copy){

  if(x.type==='exchange')Object.assign(d,{fromCur:x.fromCur,toCur:x.toCur,fromStr:String(x.fromAmt/100),toStr:String(x.toAmt/100)});

function orderedIds(t,d){return t.members.map(m=>m.id).filter(id=>d.ids.has(id))}
function draftCalc(d){

  const ids=orderedIds(t,d);const v=toCents(d.amountStr);let splits=[],total=v,err='';
  if(d.type==='deposit'&&d.src==='ext'){if(!(v>0))err='请填写金额';else if(!String(d.srcName||'').trim())err='请填写钱从哪来，如 公司备用金';return {ids:[],splits:[],total:v,err,ext:true}}
  if(!ids.length)err=d.type==='personal'?'请选择是谁的支出':d.type==='deposit'?'请选择谁存入':'请至少选择一个人';
  else if(d.type==='deposit'&&d.per){splits=ids.map(m=>({m,amt:v}));total=v*ids.length;if(!(v>0))err='请填写每人金额'}
  else if(d.mode==='custom'&&d.type!=='personal'){splits=ids.map(m=>({m,amt:toCents(d.custom[m])||0}));const s=sum(splits.map(x=>x.amt));if(!(v>0))err='请填写总金额';else if(s!==v)err=`各人合计 ${money(s,d.cur)}，与总额相差 ${money(v-s,d.cur)}`}

    if(!err&&d.mode==='shares'&&!splits.some(s=>s.amt>0))err='份数不能全为 0'}
  return {ids,splits,total,err};
}

    ${x.advBy?`<p class="note" style="color:var(--warn)">${esc(mName(t,x.advBy))} 自掏腰包垫付，这 ${money(x.amount,x.cur)} 记为他的投入。</p>`:''}</div>`;
  }
  h+=`<div class="card kv"><div><span>时间</span><span>${dayLabel(x.time.slice(0,10))} ${hm(x.time)}</span></div>${x.category&&x.type==='expense'?`<div><span>类别</span><span>${esc(x.category)}</span></div>`:''}${x.place?`<div><span>地点</span><span>${esc(x.place)}</span></div>`:''}${x.note?`<div><span>备注</span><span>${esc(x.note)}</span></div>`:''}<div><span>编号</span><span class="num">#${x.id} <button class="link" data-a="copy" data-v="#${x.id}">复制</button></span></div></div>`;
  if(x.photos?.length)h+=`<div class="card"><h4>照片（${x.photos.length}）</h4><div class="photos">${x.photos.map((p,k)=>`<button class="ph" data-a="view" data-i="${k}" data-src="tx" data-id="${x.id}"><img data-photo="${p}" alt="照片${k+1}"></button>`).join('')}</div></div>`;
  h+=x.deleted?`<div class="btns"><button class="btn2" data-a="restore" data-id="${x.id}">恢复这笔</button></div>`:`<div class="btns"><button class="btn2" data-a="edit" data-id="${x.id}">编辑</button><button class="btn2" data-a="dup" data-id="${x.id}">再记一笔同样的</button><button class="btn2 danger" data-a="del" data-id="${x.id}" data-confirm="再点一次删除">删除</button></div>`;
  return h;
};

/* ----- 成员详情 ----- */
SHEETS.member=({id})=>{
  const t=T();const m=mOf(t,id);if(!m)return head('成员不存在');
  const s=C.mem[id];const b=s.in-s.out;
  const xs=live(t).filter(x=>(x.splits||[]).some(y=>y.m===id)||x.advBy===id).sort(byTime).reverse();
  const curs=[...new Set([...Object.keys(s.inC),...Object.keys(s.outC)])];
  let h=head(`${av(t,id)} ${esc(m.name)} 的账`);
  h+=`<div class="hero"><div><div class="lbl">余额（${b<0?'欠钱袋':'钱袋欠他'}）</div><div class="big num">${money(b,t.base,true)}</div></div><div class="row"><span>投入 <b>${money(s.in,t.base)}</b></span><span>已用 <b>${money(s.out,t.base)}</b></span><span>${xs.length} 笔相关</span></div></div>`;
  h+=`<button class="btn2" data-a="stmt" data-v="m:${id}">${esc(m.name)} 的 A4 账单 / 打印</button>`;
  if(curs.length)h+=`<div class="card scroll-x"><table class="tbl"><thead><tr><th>币种</th><th>投入</th><th>用掉</th></tr></thead><tbody>${curs.map(c=>`<tr><td>${c}</td><td class="num">${money(s.inC[c]||0,c)}</td><td class="num">${money(s.outC[c]||0,c)}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<div class="card rows" style="padding-block:2px">${xs.map(x=>{const mine=(x.splits||[]).find(y=>y.m===id);const i=C.info[x.id];const parts=[];
    if(x.type==='deposit')parts.push(`<span class="pos">+${money(mine.amt,x.cur)}</span>`);
    else{if(x.advBy===id)parts.push(`<span class="pos">垫付 +${money(x.amount,x.cur)}</span>`);if(mine)parts.push(`<span>占 −${money(mine.amt,x.cur)}</span>`)}
    return `<button class="txr" data-a="tx" data-id="${x.id}">${txIcon(x)}<span class="mid"><span class="t1"><span class="n">${esc(txTitle(t,x))}</span></span><span class="t2">${dayLabel(x.time.slice(0,10))} ${hm(x.time)} · 总 ${money(x.amount,x.cur)}${x.type==='expense'?` / ${x.splits.length}人`:''}</span></span><span class="rt"><div class="a1 num">${parts.join('<br>')}</div>${mine&&x.cur!==t.base?`<div class="a2 num">≈${money(mine.amt*i.rate,t.base)}</div>`:''}</span></button>`}).join('')||'<div class="empty">暂无相关记录</div>'}</div>`;
  return h;
};

  const t=T();const r=settle(t);

  let txt=`【${t.name}】结算（${cname(t.base)}）\n`+r.ppl.map(p=>`${p.name}：投入 ${money(C.mem[p.id].in,t.base)}，已用 ${money(C.mem[p.id].out,t.base)}，余额 ${money(p.b,t.base,true)}`).join('\n')+'\n转账：\n'+(r.out.map(o=>`${o.from.name} → ${o.to.name}  ${money(o.v,t.base)}`).join('\n')||'无需转账');

  <div class="card"><h4>最少转账</h4>${r.out.length?r.out.map(o=>`<div class="xfer"><b>${esc(o.from.name)}</b><span class="ar">→</span><b>${esc(o.to.name)}</b><span class="v num">${money(o.v,t.base)}</span></div>`).join(''):'<div class="empty">账已平，无需转账</div>'}
  ${r.pool>0?`<p class="note">「钱袋剩余」= 钱袋里还剩的钱（按成本价折合 ${money(r.pool,t.base)}）。直接从钱袋拿出来给对应的人即可。</p>`:''}</div>
  ${left.length?`<div class="card"><h4>钱袋里剩的钱</h4><div class="kv">${left.map(([c,a])=>`<div><span>${c} ${cname(c)}</span><span class="num">${money(a.bal,c)}${c!==t.base?` <span class="hint">≈${money(a.cost,t.base)}</span>`:''}</span></div>`).join('')}</div><p class="note">外币可以先换回${cname(t.base)}（记一笔换汇）再结算，结果会按实际换回的钱更新。</p></div>`:''}
  <button class="btn2" data-a="copy" data-v="${esc(txt)}">复制结算文字（发群里）</button>`;
};

function csvOf(t){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['编号','时间','类型','类别','币种','金额','折合'+t.base,'参与人/分摊','垫付人','地点','备注','照片数'].map(L)];
  live(t).sort(byTime).forEach(x=>{const i=C.info[x.id]||{};
    if(x.type==='exchange')rows.push([x.id,x.time.replace('T',' '),L('换汇'),'',`${x.fromCur}→${x.toCur}`,`${x.fromAmt/100}→${x.toAmt/100}`,((i.base||0)/100).toFixed(2),'','',x.place,x.note,x.photos?.length||0]);
    else rows.push([x.id,x.time.replace('T',' '),L(x.type==='deposit'?'入钱':x.kind==='personal'?'个人支出':'共同支出'),L(x.category||''),x.cur,x.amount/100,((i.base||0)/100).toFixed(2),x.splits.map(s=>`${mName(t,s.m)}:${s.amt/100}`).join(' / '),x.advBy?mName(t,x.advBy):'',x.place,x.note,x.photos?.length||0])});
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\n');
}
function tryDownload(name,text,type){if(window.AndroidBridge){const p=AndroidBridge.save(name,type,text);toast(p?'已保存到 '+p:'保存失败，请用「复制」');return}try{const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('已尝试下载；没反应请用「复制」')}catch(e){toast('此环境不能下载，请用「复制」')}}
async function copyText(v){if(window.AndroidBridge){AndroidBridge.copy(v);toast('已复制');return}try{await navigator.clipboard.writeText(v);toast('已复制')}catch(e){toast('复制失败，请长按文本框手动复制')}}

/* ----- A4 账单 ----- */
function stmtData(t,d){
  const sc=d.scope||'pool';let unit=t.base,title;
  const typeOf=x=>x.type==='deposit'?(x.src==='ext'?'外部入钱':'入钱'):x.type==='exchange'?'换汇':x.kind==='personal'?'个人支出':'共同支出';
  const descOf=x=>[x.type==='expense'?x.category:'',x.note||(x.type==='expense'?'':txTitle(t,x)),x.place].filter(Boolean).join(' · ');
  const whoOf=x=>x.type==='deposit'?(x.src==='ext'?(x.srcName||'外部'):x.splits.map(s=>mName(t,s.m)).join('、')):x.type==='expense'?(x.kind==='personal'?mName(t,x.splits[0]?.m):x.splits.map(s=>mName(t,s.m)).join('、')):'';
  const rows=[];
  if(sc==='pool')title='钱袋总账';else if(sc.startsWith('cur:')){unit=sc.slice(4);title=`钱袋 ${unit} ${cname(unit)} 账户`}else title=`${mName(t,sc.slice(2))} 个人账单`;
  for(const x of live(t).sort(byTime)){
    const i=C.info[x.id]||{rate:1,base:0};let inn=0,out=0,orig='',orig2='',type=typeOf(x);
    if(sc==='pool'){
      if(x.type==='deposit'){inn=i.base;orig=money(x.amount,x.cur)}
      else if(x.type==='expense'){out=i.base;orig=money(x.amount,x.cur);if(x.advBy){inn=x.amount*i.rate;orig2=`${mName(t,x.advBy)} 垫付`}}
      else orig=`${money(x.fromAmt,x.fromCur)} → ${money(x.toAmt,x.toCur)}`;
    }else if(sc.startsWith('cur:')){
      if(x.type==='deposit'&&x.cur===unit)inn=x.amount;
      else if(x.type==='expense'&&x.cur===unit){out=x.amount;if(x.advBy){inn=x.amount;orig2=`${mName(t,x.advBy)} 垫付`}}
      else if(x.type==='exchange'&&x.fromCur===unit){out=x.fromAmt;orig=`换得 ${money(x.toAmt,x.toCur)}`}
      else if(x.type==='exchange'&&x.toCur===unit){inn=x.toAmt;orig=`付出 ${money(x.fromAmt,x.fromCur)}`}
      else continue;
    }else{
      const mid=sc.slice(2);const sp=(x.splits||[]).find(s=>s.m===mid);
      if(x.type==='deposit'){if(!sp)continue;inn=sp.amt*i.rate;orig=money(sp.amt,x.cur)}
      else if(x.type==='expense'){if(!sp&&x.advBy!==mid)continue;
        if(sp){out=sp.amt*i.rate;orig=money(sp.amt,x.cur);if(x.splits.length>1)orig2=`共 ${money(x.amount,x.cur)} · ${x.splits.length}人`}
        if(x.advBy===mid){inn=x.amount*i.rate;orig2=(orig2?orig2+' · ':'')+`本人垫付 ${money(x.amount,x.cur)}`}}
      else continue;
    }
    rows.push({x,time:x.time,type,desc:descOf(x),who:whoOf(x),orig,orig2,inn,out});
  }
  let open=0;const list=[];
  for(const r of rows){const day=r.time.slice(0,10);if(d.from&&day<d.from){open+=r.inn-r.out;continue}if(d.to&&day>d.to)continue;list.push(r)}
  let bal=open;list.forEach(r=>{bal+=r.inn-r.out;r.bal=bal});
  return {title,unit,rows:list,open,totIn:sum(list.map(r=>r.inn)),totOut:sum(list.map(r=>r.out)),close:bal,member:sc.startsWith('m:')};
}
function stmtHTML(t,d){
  if(d.scope==='all')return [{...d,scope:'pool'},...t.members.map(m=>({...d,scope:'m:'+m.id}))].map(x=>stmtOne(t,x)).join('');
  return stmtOne(t,d);
}
function stmtOne(t,d){
  const s=stmtData(t,d),u=s.unit,who=!s.member,cols=who?9:8;
  const range=(d.from||d.to)?`${d.from||'开始'} 至 ${d.to||'现在'}`:dateRange(t);
  return `<div class="a4"><div class="h"><div><h1>${esc(t.name)} · ${esc(s.title)}</h1><div style="font-size:11px;color:#55635E">期间 ${esc(range)} · 金额单位 ${u} ${cname(u)}</div></div><div class="meta">出差钱袋<br>打印时间 ${nowLocal().replace('T',' ')}</div></div>
  <div class="sum"><div><span>期初余额</span><b>${money(s.open,u)}</b></div><div><span>入 合计</span><b>${money(s.totIn,u)}</b></div><div><span>出 合计</span><b>${money(s.totOut,u)}</b></div><div><span>期末余额</span><b>${money(s.close,u)}</b></div></div>
  <table><thead><tr><th>#</th><th>时间</th><th>类型</th><th>摘要（类别 · 备注 · 地点）</th>${who?'<th>相关人</th>':''}<th class="n">原币金额</th><th class="n">入</th><th class="n">出</th><th class="n">余额</th></tr></thead><tbody>
  ${d.from?`<tr class="open"><td></td><td colspan="${cols-2}">期初余额</td><td class="n">${money(s.open,u)}</td></tr>`:''}
  ${s.rows.map((r,k)=>`<tr><td>${k+1}</td><td class="t">${r.time.slice(5,10).replace('-','/')} ${hm(r.time)}</td><td class="ty">${esc(r.type)}</td><td>${esc(r.desc)}${r.x.photos?.length?` <span style="color:#8A6A2A">[图${r.x.photos.length}]</span>`:''}</td>${who?`<td class="who">${esc(r.who)}</td>`:''}<td class="n orig">${esc(r.orig)}${r.orig2?`<div class="o2">${esc(r.orig2)}</div>`:''}</td><td class="n in">${r.inn?money(r.inn,u):''}</td><td class="n out">${r.out?money(r.out,u):''}</td><td class="n">${money(r.bal,u)}</td></tr>`).join('')||`<tr><td colspan="${cols}" style="text-align:center;color:#888;padding:16px">这段时间没有记录</td></tr>`}
  <tr class="close"><td></td><td colspan="${cols-4}">合计</td><td class="n in">${money(s.totIn,u)}</td><td class="n out">${money(s.totOut,u)}</td><td class="n">${money(s.close,u)}</td></tr></tbody></table>
  ${(d.scope||'pool').startsWith('cur:')?'':`<div class="fine">外币按换汇实际成本折算为${cname(t.base)}。${s.member?'入 = 本人存入和垫付；出 = 本人分摊到的支出。':'换汇只是钱袋内部换币，不计入、出。'}</div>`}
  <div class="foot"><span>记账人</span><span>核对人</span><span>日期</span></div></div>`;
}
function stmtTSV(t,d){
  if(d.scope==='all')return [{...d,scope:'pool'},...t.members.map(m=>({...d,scope:'m:'+m.id}))].map(x=>stmtTSV(t,x)).join('\n\n');
  const s=stmtData(t,d);const rows=[['时间','类型','摘要','相关人','原币金额','入','出','余额'].map(L)];
  s.rows.forEach(r=>rows.push([r.time.replace('T',' '),L(r.type),L(r.desc),r.who,r.orig,r.inn?(r.inn/100).toFixed(2):'',r.out?(r.out/100).toFixed(2):'',(r.bal/100).toFixed(2)]));
  return L(`${t.name} ${s.title}（${s.unit}）`)+'\n'+rows.map(r=>r.map(v=>String(v).replace(/\t|\n/g,' ')).join('\t')).join('\n')}
SHEETS.stmt=d=>{
  const t=T();
  const opts=[['all','钱袋总账 + 全部成员账单'],['pool',`钱袋总账（折合 ${t.base}）`],...t.currencies.map(c=>['cur:'+c.code,`钱袋 ${c.code} ${cname(c.code)} 账户`]),...t.members.map(m=>['m:'+m.id,`${m.name} 个人账单`])];
  return head('A4 账单')+`<label class="fl">打印哪一本账<select class="in" id="st-scope" data-st="scope">${opts.map(([k,l])=>`<option value="${k}" ${d.scope===k?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
  <div class="frow"><label class="fl">从（可不填）<input class="in" type="date" id="st-from" data-st="from" value="${d.from||''}"></label><label class="fl">到（可不填）<input class="in" type="date" id="st-to" data-st="to" value="${d.to||''}"></label></div>
  <button class="btn" data-a="print">打印 / 存为 PDF</button>
  <div class="paper-wrap">${stmtHTML(t,d)}</div>
  <button class="btn2" data-a="stmt-copy">复制为表格（可粘贴到 Excel）</button>`;
};

/* ----- 照片查看 ----- */
let viewer=null;
function openViewer(list,idx){
  viewer={list,idx,zoom:false};const el=document.createElement('div');el.className='viewer';el.id='viewer';document.body.appendChild(el);drawViewer();
}
async function drawViewer(){
  const el=$('#viewer');if(!el||!viewer)return;const {list,idx}=viewer;
  el.classList.toggle('zoom',viewer.zoom);
  el.innerHTML=`<div class="vt"><span>${idx+1} / ${list.length}</span><span style="display:flex;gap:8px"><button data-a="v-zoom">${viewer.zoom?'适应屏幕':'放大'}</button><button data-a="v-close">关闭</button></span></div><div class="vs"><img alt="照片 ${idx+1}" id="v-img"></div><div class="nav"><button data-a="v-prev" ${idx<=0?'disabled':''}>‹ 上一张</button><button data-a="v-next" ${idx>=list.length-1?'disabled':''}>下一张 ›</button></div>`;
  tr(el);const d=await getPhoto(list[idx]);const img=$('#v-img');if(img&&d)img.src=d;
  let sx=null;const vs=$('.vs',el);vs.ontouchstart=e=>{if(e.touches.length===1)sx=e.touches[0].clientX};vs.ontouchend=e=>{if(sx==null||viewer.zoom)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)step(dx<0?1:-1)};
}
function step(k){if(!viewer)return;const n=viewer.idx+k;if(n<0||n>=viewer.list.length)return;viewer.idx=n;viewer.zoom=false;drawViewer()}

/* ---------- 交互 ---------- */
let toastT;function toast(m){m=trText(m);let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200)}
function armed(b){if(!b.dataset.confirm)return true;if(b.classList.contains('armed'))return true;b.dataset.orig=b.textContent;b.textContent=b.dataset.confirm;b.classList.add('armed');setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=b.dataset.orig}},3500);return false}
const ACT={
  lang:b=>{const v=b.dataset.v;if(v===LANG)return;LANG=v;S.lang=v;
    if(S.trips.length===1&&S.trips[0].demo&&!S.trips[0].touched){const n=seed(v);S.trips=n.trips;S.cur=n.cur}
    save(true);filt.m='';refresh();toast(v==='tk'?'Dil: Türkmençe':'语言：中文')},
  tab:b=>{tab=b.dataset.v;render();scrollTo(0,0)},
  add:b=>openSheet('form',newDraft(b.dataset.v)),
  close:()=>closeSheet(),
  tx:b=>openSheet('tx',{id:b.dataset.id}),
  member:b=>openSheet('member',{id:b.dataset.id}),
  settle:()=>openSheet('settle',{}),
  trips:()=>openSheet('trips',{}),
  goday:b=>{filt.day=b.dataset.v;filt.type='all';tab='list';render();scrollTo(0,0)},
  'clear-day':()=>{filt.day='';render()},
  'ftype-l':b=>{filt.type=b.dataset.v;render()},
  ftype:b=>{const s=topForm(),d=s.data,t=T();const v=b.dataset.v;if(v===d.type)return;
    if(v==='personal'){const f=orderedIds(t,d);d.ids=new Set(f.length===1?f:[])}else if(d.type==='personal'&&d.ids.size<=1&&v!=='exchange')d.ids=new Set(t.members.map(m=>m.id));
    if(v==='deposit'&&d.type!=='deposit')d.per=true;d.type=v;renderSheet(s)},
  'f-chip':b=>{const s=topForm(),d=s.data;const id=b.dataset.id;if(d.type==='personal')d.ids=new Set([id]);else d.ids.has(id)?d.ids.delete(id):d.ids.add(id);renderSheet(s)},
  'f-all':()=>{const s=topForm();s.data.ids=new Set(T().members.map(m=>m.id));renderSheet(s)},
  'f-none':()=>{const s=topForm();s.data.ids=new Set();renderSheet(s)},
  'f-mode':b=>{const s=topForm(),d=s.data;d.mode=b.dataset.v;if(d.mode==='custom'){const r=draftCalc({...d,mode:'equal'});(r.splits||[]).forEach(x=>{if(d.custom[x.m]==null||d.custom[x.m]==='')d.custom[x.m]=String(x.amt/100)})}renderSheet(s)},
  'f-src':b=>{const s=topForm();s.data.src=b.dataset.v;renderSheet(s)},
  stmt:b=>{const s=openSheet('stmt',{scope:b.dataset.v||'all'});s.body.classList.add('wide')},
  print:()=>{const s=[...sheets].reverse().find(x=>x.kind==='stmt');const t=T();$('#print-root').innerHTML=stmtHTML(t,s.data);tr($('#print-root'));
    if(window.AndroidBridge&&AndroidBridge.print){AndroidBridge.print(`${t.name}-${trText(s.data.scope==='all'?'钱袋总账 + 全部成员账单':stmtData(t,s.data).title)}`);return}
    const t0=Date.now();try{window.print()}catch(e){}if(Date.now()-t0<300)toast('没有弹出打印窗口？请用浏览器菜单里的「打印」，或「复制为表格」')},
  'stmt-copy':()=>{const s=[...sheets].reverse().find(x=>x.kind==='stmt');copyText(stmtTSV(T(),s.data))},
  'f-cat':b=>{const s=topForm();s.data.category=b.dataset.v;renderSheet(s)},
  'ph-rm':b=>{const s=topForm();const id=s.data.photos.splice(+b.dataset.i,1)[0];if(!s.data.editId||!T().txs.find(x=>x.id===s.data.editId)?.photos.includes(id))delPhoto(id);$('#f-photos',s.body).innerHTML=photosHTML(s.data);hydrate(s.body)},
  view:b=>{let list;if(b.dataset.src==='form')list=topForm().data.photos;else list=T().txs.find(x=>x.id===b.dataset.id).photos;openViewer(list,+b.dataset.i)},
  'v-close':()=>{$('#viewer')?.remove();viewer=null},'v-prev':()=>step(-1),'v-next':()=>step(1),'v-zoom':()=>{viewer.zoom=!viewer.zoom;drawViewer()},
  save:()=>saveDraft(topForm()),
  edit:b=>{const x=T().txs.find(y=>y.id===b.dataset.id);openSheet('form',draftFromTx(x,false))},
  dup:b=>{const x=T().txs.find(y=>y.id===b.dataset.id);openSheet('form',draftFromTx(x,true))},
  del:b=>{if(!armed(b))return;const x=T().txs.find(y=>y.id===b.dataset.id);x.deleted=Date.now();save();closeSheet();refresh();toast('已移到回收站')},
  restore:b=>{const x=T().txs.find(y=>y.id===b.dataset.id);delete x.deleted;save();refresh();toast('已恢复')},
  purge:b=>{if(!armed(b))return;const t=T();const i=t.txs.findIndex(y=>y.id===b.dataset.id);(t.txs[i].photos||[]).forEach(delPhoto);t.txs.splice(i,1);save();refresh()},
  copy:b=>copyText(b.dataset.v),
  'trip-sw':b=>{S.cur=b.dataset.id;save();closeSheet();filt.m='';filt.cur='';filt.day='';render()},
  'nt-more':()=>{const s=sheets[sheets.length-1];syncNT(s);s.data.rows.push('');renderSheet(s)},
  'trip-create':()=>{const s=sheets[sheets.length-1];syncNT(s);const d=s.data;const names=d.rows.map(v=>v.trim()).filter(Boolean);
    if(!d.name?.trim()){toast('请填写行程名称');return}if(!names.length){toast('请至少填一个成员');return}
    const base=d.base;const t={id:uid(),name:d.name.trim(),base,members:names.map((n,i)=>({id:uid()+i,name:n,color:i})),currencies:[{code:base,rate:1}],categories:[...CATS],budget:0,txs:[]};
    S.trips.push(t);S.cur=t.id;save();closeSheet();tab='home';render();toast('行程已创建，可在「设置」里添加外币')},
  'trip-del':b=>{if(!armed(b))return;const t=T();t.txs.forEach(x=>(x.photos||[]).forEach(delPhoto));S.trips=S.trips.filter(x=>x!==t);if(!S.trips.length){const n=seed();S.trips=n.trips}S.cur=S.trips[0].id;save();tab='home';render();toast('行程已删除')},
  'm-add':()=>{const i=$('#s-m-new');const n=i.value.trim();if(!n)return;const t=T();t.members.push({id:uid(),name:n,color:t.members.length});save();render()},
  'm-del':b=>{const t=T();t.members=t.members.filter(m=>m.id!==b.dataset.id);save();render()},
  'c-add':()=>{const c=$('#s-c-new').value;if(!c)return;T().currencies.push({code:c,rate:1});save();render();toast(`已添加 ${c}，请填写参考汇率`)},
  'c-del':b=>{const t=T();t.currencies=t.currencies.filter(c=>c.code!==b.dataset.id);save();render()},
  'cat-add':()=>{const v=$('#s-cat-new').value.trim();const t=T();if(v&&!t.categories.includes(v)){t.categories.push(v);save();render()}},
  'cat-del':b=>{const t=T();t.categories=t.categories.filter(c=>c!==b.dataset.v);save();render()},
  trash:()=>openSheet('trash',{}),
  backup:()=>openSheet('backup',{}),
  csv:()=>openSheet('csv',{}),
  'csv-copy':()=>copyText($('#csv-out').value),
  'csv-dl':()=>tryDownload(`${T().name}.csv`,csvOf(T()),'text/csv;charset=utf-8'),
  'bk-ph':b=>{sheets[sheets.length-1].data.withPhotos=b.checked},
  'bk-make':async()=>{const s=sheets[sheets.length-1];const photos={};if(s.data.withPhotos!==false){for(const id of await allPhotoIds()){const v=await getPhoto(id);if(v)photos[id]=v}}
    s.data.json=JSON.stringify({app:'出差钱袋',version:1,exported:nowLocal(),data:S,photos});renderSheet(s)},
  'bk-copy':()=>copyText($('#bk-out').value),
  'bk-dl':()=>tryDownload(`出差钱袋备份-${nowLocal().slice(0,10)}.json`,$('#bk-out').value,'application/json'),
  'bk-import':async b=>{const raw=$('#bk-in').value.trim();if(!raw){toast('请先选择备份文件或粘贴内容');return}if(!armed(b))return;
    try{const o=JSON.parse(raw);if(!o.data?.trips?.length)throw 0;S=o.data;for(const[k,v]of Object.entries(o.photos||{}))await putPhoto(k,v);if(!S.trips.some(t=>t.id===S.cur))S.cur=S.trips[0].id;save();closeSheet();tab='home';render();toast('已恢复备份')}catch(e){toast('备份内容无法识别，请检查是否完整')}},
};
function syncNT(s){s.data.name=$('#nt-name',s.body).value;s.data.base=$('#nt-base',s.body).value;s.body.querySelectorAll('[data-nt]').forEach(i=>s.data.rows[+i.dataset.nt]=i.value)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b){if(e.target.classList?.contains('ov'))closeSheet();return}
  if(b.disabled)return;const f=ACT[b.dataset.a];if(f){if(b.tagName!=='INPUT')e.preventDefault();f(b,e)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(viewer)ACT['v-close']();else closeSheet()}if(viewer&&e.key==='ArrowLeft')step(-1);if(viewer&&e.key==='ArrowRight')step(1)});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f){const s=topForm();if(!s)return;const d=s.data,f=el.dataset.f;const v=el.type==='checkbox'?el.checked:el.value;
    if(f.includes('.')){const[a,k]=f.split('.');d[a][k]=v}else d[f]=v;
    if(['cur','fromCur','toCur','advOn','per','advBy'].includes(f)){if(f==='cur')d.rate='';renderSheet(s)}else updatePreview(s);return}
  if(el.dataset.st){const s=[...sheets].reverse().find(x=>x.kind==='stmt');if(s){s.data[el.dataset.st]=el.value;renderSheet(s)}return}
  if(el.dataset.q){filt[el.dataset.q]=el.value;if(el.dataset.q==='q'){$('#list-res').innerHTML=listRes(T());tr($('#list-res'))}else render()}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.s){const t=T();const k=el.dataset.s;
    if(k==='name'&&el.value.trim())t.name=el.value.trim();
    if(k==='budget'){const v=toCents(el.value);t.budget=v>0?v:0}
    if(k==='member'&&el.value.trim())mOf(t,el.dataset.id).name=el.value.trim();
    if(k==='rate'){const v=Number(el.value);if(v>0)t.currencies.find(c=>c.code===el.dataset.id).rate=v}
    save();render();toast('已保存');return}
  if(el.dataset.file==='1'){const s=topForm();const files=[...el.files];if(!files.length)return;toast('正在压缩照片…');
    for(const f of files){const d=await compress(f);if(!d)continue;const id='p'+uid();await putPhoto(id,d);s.data.photos.push(id)}
    $('#f-photos',s.body).innerHTML=photosHTML(s.data);hydrate(s.body);toast(`已添加 ${files.length} 张`);return}
  if(el.dataset.file==='bk'){const f=el.files[0];if(!f)return;$('#bk-in').value=await f.text();toast('已读取，点「恢复」确认')}
});

/* ---------- 启动 ---------- */
async function boot(){
  S=load();LANG=S?.lang||'zh';
  if(!S){S=seed('zh');save(true);putPhoto('demo-receipt',demoReceipt())}
  else if(S.trips.some(t=>t.txs.some(x=>x.photos?.includes('demo-receipt')))&&!(await getPhoto('demo-receipt')))putPhoto('demo-receipt',demoReceipt());
  render();
  const h=location.hash.slice(1);if(h){const x=T().txs.find(y=>y.id===h);if(x)openSheet('tx',{id:h})}
}
window.__back=()=>{if(viewer){ACT['v-close']();return true}if(sheets.length){closeSheet();return true}if(tab!=='home'){tab='home';render();return true}return false};
boot();
})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.AndroidBridge)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
